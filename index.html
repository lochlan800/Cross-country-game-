<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CROSS COUNTRY MANAGER</title>
<style>
/* ============================================================
   RETRO STYLING - limited palette, chunky borders, hard shadows
   ============================================================ */
:root{
  --bg:#0d1017;
  --panel:#1a2130;
  --panel2:#141a26;
  --line:#39465f;
  --line2:#28324a;
  --ink:#d9e2f2;
  --dim:#8493ad;
  --gold:#f5c542;
  --green:#5fd35f;
  --red:#e0574a;
  --blue:#4f9de0;
  --mud:#7a5230;
  --hill:#b8813c;
  --grass:#6fb442;
  --uneven:#9c9483;
  --flat:#3f8f45;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Lucida Console","DejaVu Sans Mono",Consolas,monospace;
  font-size:13px;
  line-height:1.45;
  letter-spacing:.4px;
  padding:10px;
  -webkit-font-smoothing:none;
}
h1,h2,h3{margin:0 0 8px;text-transform:uppercase;letter-spacing:2px;font-weight:bold}
h1{font-size:19px;color:var(--gold);text-shadow:2px 2px 0 #000}
h2{font-size:15px;color:var(--gold)}
h3{font-size:12px;color:var(--ink)}
a{color:var(--gold)}

#app{max-width:1120px;margin:0 auto}

.panel{
  background:var(--panel);
  border:3px solid var(--line);
  box-shadow:4px 4px 0 #000;
  padding:10px 12px;
  margin-bottom:12px;
}
.panel.tight{padding:6px 8px}
.panel2{background:var(--panel2);border:2px solid var(--line2);padding:8px;margin-bottom:8px}

/* ---- top bar ---- */
#topbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
#topbar .brand{display:flex;flex-direction:column}
#topbar .brand small{color:var(--dim);letter-spacing:1px;text-transform:uppercase;font-size:10px}
.stats-strip{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:2px solid var(--line);background:var(--panel2);
  padding:3px 8px;text-transform:uppercase;font-size:11px;letter-spacing:1px;
  white-space:nowrap;
}
.chip b{color:var(--gold)}
.chip.money b{color:var(--green)}

/* ---- nav ---- */
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
button,.btn{
  font-family:inherit;font-size:12px;letter-spacing:1px;text-transform:uppercase;
  color:var(--ink);background:var(--panel);
  border:3px solid var(--line);box-shadow:3px 3px 0 #000;
  padding:6px 12px;cursor:pointer;
}
button:hover:not(:disabled){background:var(--gold);color:#000;border-color:var(--gold)}
button:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 #000}
button:disabled{opacity:.4;cursor:not-allowed}
button.on{background:var(--gold);color:#000;border-color:#fff}
button.primary{border-color:var(--green);color:var(--green)}
button.primary:hover:not(:disabled){background:var(--green);color:#000}
button.small{padding:2px 6px;font-size:11px;border-width:2px;box-shadow:2px 2px 0 #000}
button.danger{border-color:var(--red);color:var(--red)}
button.danger:hover:not(:disabled){background:var(--red);color:#000}

/* ---- tables ---- */
table{border-collapse:collapse;width:100%;font-size:12px}
th{
  text-align:left;text-transform:uppercase;font-size:10px;letter-spacing:1px;
  color:var(--dim);border-bottom:2px solid var(--line);padding:4px 5px;white-space:nowrap;
}
td{padding:3px 5px;border-bottom:1px solid var(--line2);vertical-align:middle}
td.runner{white-space:nowrap}
tr.me td{background:#26304a}
tr.me td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---- stat pips ---- */
.pips{display:inline-flex;gap:1px;vertical-align:middle}
.pip{width:6px;height:11px;background:#2b3448;border:1px solid #000}
.pip.on{background:var(--green)}
.pip.mid{background:var(--gold)}
.pip.low{background:var(--red)}
.statval{display:inline-block;min-width:22px;text-align:right;color:var(--dim);font-size:11px}
.up{color:var(--green)}
.down{color:var(--red)}

/* ---- grid helpers ---- */
.grid{display:grid;gap:10px}
.cols2{grid-template-columns:1fr 1fr}
.cols3{grid-template-columns:repeat(3,1fr)}
@media(max-width:820px){.cols2,.cols3{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.muted{color:var(--dim)}
.small{font-size:11px}
.right{text-align:right}
.center{text-align:center}

/* ---- shop / training cards ---- */
.card{
  border:2px solid var(--line2);background:var(--panel2);padding:8px;
  display:flex;flex-direction:column;gap:6px;
}
.card.owned{border-color:var(--green)}
.card.locked{opacity:.75}
.card .title{text-transform:uppercase;letter-spacing:1px;color:var(--gold);font-size:12px}
.price{color:var(--green);font-weight:bold}
.tag{
  display:inline-block;border:1px solid var(--line);padding:0 4px;font-size:10px;
  text-transform:uppercase;letter-spacing:1px;color:var(--dim);
}
.tag.good{color:var(--green);border-color:var(--green)}
.tag.bad{color:var(--red);border-color:var(--red)}

/* ---- canvas ---- */
#raceWrap{background:#000;border:3px solid var(--line);box-shadow:4px 4px 0 #000;padding:0;line-height:0}
canvas{
  display:block;width:100%;height:auto;
  image-rendering:pixelated;image-rendering:crisp-edges;
}

/* ---- analysis bars ---- */
.lossrow{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.lossname{width:96px;text-transform:uppercase;font-size:11px;letter-spacing:1px}
.lossbar{flex:1;height:12px;background:#222a3c;border:1px solid #000;position:relative}
.lossbar i{display:block;height:100%;background:var(--red)}
.lossbar i.gain{background:var(--green)}
.lossnum{width:56px;text-align:right;font-size:11px;color:var(--dim)}

/* ---- season progress strip ---- */
.sbwrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sbblocks{display:flex;gap:4px}
.sb{
  min-width:30px;height:26px;padding:0 3px;
  border:2px solid var(--line2);background:var(--panel2);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--dim);letter-spacing:0;position:relative;
}
.sb.done{border-color:var(--line);color:var(--ink)}
.sb.win{background:#12240f;border-color:var(--green);color:var(--green)}
.sb.now{border-color:var(--gold);color:var(--gold);background:#241f0d}
.sb.home::after{
  content:"";position:absolute;left:2px;right:2px;bottom:-2px;height:3px;background:var(--gold);
}
.seasontitle{text-transform:uppercase;letter-spacing:1px;font-size:11px;color:var(--dim)}
.seasontitle b{color:var(--gold)}
.outlook{text-transform:uppercase;letter-spacing:1px;font-size:11px}
.outlook.up{color:var(--green)}
.outlook.down{color:var(--red)}
.outlook.mid{color:var(--gold)}

.terrainkey{display:flex;gap:8px;flex-wrap:wrap;font-size:10px;text-transform:uppercase;letter-spacing:1px}
.terrainkey span{display:flex;align-items:center;gap:4px}
.swatch{width:10px;height:10px;border:1px solid #000;display:inline-block}

.banner{
  border:3px solid var(--gold);background:#241f0d;color:var(--gold);
  padding:8px 10px;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px;
  box-shadow:4px 4px 0 #000;
}
.banner.bad{border-color:var(--red);background:#2a1414;color:var(--red)}
.banner.good{border-color:var(--green);background:#12240f;color:var(--green)}

select{
  font-family:inherit;font-size:11px;background:var(--panel2);color:var(--ink);
  border:2px solid var(--line);padding:2px 4px;
}
.hidden{display:none !important}
.blink{animation:bl 1s steps(2,end) infinite}
@keyframes bl{50%{opacity:.35}}
footer{color:var(--dim);font-size:10px;text-align:center;padding:8px 0 20px;letter-spacing:1px}
</style>
</head>
<body>
<div id="app">
  <div class="panel tight" id="topbar">
    <div class="brand">
      <h1 id="clubName">CROSS COUNTRY MANAGER</h1>
      <small id="clubSub">retro relay league</small>
    </div>
    <div class="stats-strip" id="strip"></div>
  </div>

  <nav id="nav"></nav>
  <div class="panel tight" id="seasonbar"></div>
  <div id="screen"></div>

  <footer>CROSS COUNTRY MANAGER &mdash; SAVES AUTOMATICALLY TO THIS BROWSER</footer>
</div>

<script>
"use strict";
/* ================================================================
   CROSS COUNTRY MANAGER
   A retro pixel-art cross country team manager.
   Everything lives in this one file: DATA / SIM / RENDER / UI / SAVE
   ================================================================ */

/* ================================================================
   SECTION 1 : UTILITIES
   ================================================================ */
const clamp = (v,a,b)=>v<a?a:(v>b?b:v);
const rnd = (a=1,b=0)=>b+Math.random()*(a-b);
const pick = arr=>arr[(Math.random()*arr.length)|0];
const ri  = (a,b)=>a+((Math.random()*(b-a+1))|0);

// seeded RNG so a named course always generates the same shape
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
// roughly-normal distribution, mean 0, sd 1
function gauss(){
  let u=0,v=0;
  while(u===0)u=Math.random();
  while(v===0)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}
function shuffle(arr,rng=Math.random){
  for(let i=arr.length-1;i>0;i--){
    const j=(rng()*(i+1))|0;
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function fmtTime(s){
  if(!isFinite(s))return "--:--";
  const m=Math.floor(s/60), sec=s-m*60;
  return m+":"+(sec<10?"0":"")+sec.toFixed(1);
}
function fmtGap(s){
  if(s<=0.05)return "";
  return "+"+s.toFixed(1);
}
function money(n){ return "£"+Math.round(n).toLocaleString("en-GB"); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function ordinal(n){
  const s=["th","st","nd","rd"], v=n%100;
  return n+(s[(v-20)%10]||s[v]||s[0]);
}

/* ================================================================
   SECTION 2 : DATA
   ================================================================ */

/* ---- the eight running attributes ---------------------------- */
const STATS = [
  {key:"fitness",   name:"Fitness",     short:"FIT", desc:"How long they hold pace before fading"},
  {key:"speed",     name:"Speed",       short:"SPD", desc:"Flat-out pace on good ground"},
  {key:"sprint",    name:"Sprint",      short:"SPR", desc:"Kick into the handover / finish"},
  {key:"hills",     name:"Hills",       short:"HIL", desc:"Climbing strength"},
  {key:"mud",       name:"Mud",         short:"MUD", desc:"Grip and drive in heavy ground"},
  {key:"longGrass", name:"Long Grass",  short:"GRS", desc:"Lifting the knees through deep grass"},
  {key:"wind",      name:"Wind",        short:"WND", desc:"Holding form into a headwind"},
  {key:"uneven",    name:"Uneven",      short:"UNV", desc:"Footing on rough, rutted ground"},
];
const STAT_KEYS = STATS.map(s=>s.key);
const STAT_BY_KEY = {}; STATS.forEach(s=>STAT_BY_KEY[s.key]=s);

/* ---- terrain types ------------------------------------------- */
const TERRAIN = {
  flat:      {name:"Firm Grass", stat:"speed",     col:"#3f8f45", edge:"#2b6330", drain:1.00},
  hill:      {name:"Hill",       stat:"hills",     col:"#b8813c", edge:"#7d5624", drain:1.42},
  mud:       {name:"Mud",        stat:"mud",       col:"#7a5230", edge:"#4f341c", drain:1.34},
  longGrass: {name:"Long Grass", stat:"longGrass", col:"#6fb442", edge:"#487a2b", drain:1.22},
  uneven:    {name:"Uneven",     stat:"uneven",    col:"#9c9483", edge:"#6a6458", drain:1.16},
};
const TERRAIN_KEYS = Object.keys(TERRAIN);

/* ---- runner names -------------------------------------------- */
const FIRST = ["Alfie","Bobby","Callum","Danny","Elliot","Fraser","George","Harvey","Isaac","Jonah",
  "Kieran","Liam","Milo","Nathan","Ollie","Patrick","Quinn","Reece","Sam","Toby","Umar","Vinnie",
  "Wesley","Zac","Archie","Bertie","Corey","Dexter","Eli","Finn","Gethin","Hugo","Ivan","Jamie",
  "Kai","Louis","Mason","Noah","Otis","Percy","Rory","Seth","Theo","Wilf","Yusuf","Casey","Robin",
  "Ashley","Jesse","Morgan","Riley","Sasha","Frankie","Charlie","Alex","Jordan","Sidney","Bailey"];
const LAST = ["Ashworth","Bramley","Cotterill","Draycott","Ellwood","Fenwick","Gledhill","Hartley",
  "Ingham","Jessop","Kirkbride","Lomax","Marsden","Naylor","Oakden","Pemberton","Quarmby","Radcliffe",
  "Sowerby","Thwaite","Underhill","Vance","Wolstenholme","Yardley","Barlow","Crompton","Dinsdale",
  "Eastwood","Fairhurst","Garside","Hebden","Illingworth","Jowett","Kershaw","Longbottom","Micklewaite",
  "Netherwood","Ogden","Postlethwaite","Rushworth","Stanbury","Tetlow","Whitworth","Braithwaite","Sedgwick"];

/* ---- rival club names ---------------------------------------- */
const CLUB_NAMES = [
  ["Ashcombe Harriers","ASH","#e0574a"],
  ["Bracken Vale AC","BRV","#4f9de0"],
  ["Coldwell Striders","CLW","#9b6fd4"],
  ["Dunmere Runners","DUN","#48c2a8"],
  ["Elmsworth Pacers","ELM","#e08a3c"],
  ["Fellbeck Athletic","FEL","#d45a9b"],
  ["Grimsdale Trail Club","GRM","#7fae3f"],
  ["Hollowbrook AC","HOL","#5f6fd8"],
  ["Ironbridge Harriers","IRN","#c0c6d2"],
  ["Jarrow Moor AC","JAR","#3fb0c9"],
  ["Kestrel Fell Runners","KES","#d6b23c"],
  ["Larkspur AC","LRK","#8fd45a"],
  ["Mosswood Striders","MOS","#4bb56b"],
  ["Northgate Harriers","NRG","#e0645f"],
  ["Oakhampton AC","OAK","#a67c4a"],
  ["Pennine Crag Club","PEN","#7d8ce0"],
  ["Quarrybank Runners","QRY","#b3b0a0"],
  ["Redmoor Athletic","RED","#e04f4f"],
  ["Stonegate Harriers","STO","#8ea0b8"],
  ["Thornfield AC","THN","#5ad4c4"],
  ["Uppermill Striders","UPP","#d49a5a"],
  ["Verity Park AC","VER","#c47fd4"],
  ["Wickden Harriers","WCK","#5fb0e0"],
  ["Yarrowdale AC","YAR","#9fd44a"],
  ["Blackmoss Runners","BLK","#7a8090"],
  ["Cairnhead AC","CRN","#4fd48a"],
  ["Ditchling Harriers","DIT","#e0b04a"],
  ["Ewbank Athletic","EWB","#6f8fd4"],
  ["Foxhollow AC","FOX","#e07a3c"],
  ["Gallowtree Striders","GAL","#b45ad4"],
];

/* ---- course characters ---------------------------------------
   Every club races on its own home ground, so each club is given
   one of these. They are deliberately lopsided: a bog is a mud
   slog, a ridge is a wind tunnel, a fell is nothing but climbing.
   mix      = how many of the 16 segments are each terrain
   exposure = fraction of the loop that is wind-exposed
   tough    = 0 gentle .. 3 brutal, used to gate them by league   */
const VENUE_TYPES = [
  {suffix:"Park",    code:"PRK", tough:0, mix:{flat:12,longGrass:3,hill:1},                exposure:0.05},
  {suffix:"Meadow",  code:"MDW", tough:0, mix:{flat:10,longGrass:5,mud:1},                 exposure:0.10},
  {suffix:"Green",   code:"GRN", tough:0, mix:{flat:11,hill:2,longGrass:2,uneven:1},       exposure:0.12},
  {suffix:"Common",  code:"CMN", tough:1, mix:{flat:7,longGrass:4,mud:3,hill:2},           exposure:0.20},
  {suffix:"Downs",   code:"DWN", tough:1, mix:{flat:5,hill:6,longGrass:4,uneven:1},        exposure:0.45},
  {suffix:"Marsh",   code:"MRS", tough:2, mix:{flat:3,mud:7,longGrass:5,uneven:1},         exposure:0.30},
  {suffix:"Bog",     code:"BOG", tough:2, mix:{flat:3,mud:9,longGrass:3,uneven:1},         exposure:0.15},
  {suffix:"Quarry",  code:"QRY", tough:2, mix:{flat:3,uneven:9,hill:4},                    exposure:0.30},
  {suffix:"Fell",    code:"FEL", tough:3, mix:{flat:3,hill:8,uneven:4,mud:1},              exposure:0.40},
  {suffix:"Ridge",   code:"RDG", tough:3, mix:{flat:5,hill:5,uneven:3,longGrass:3},        exposure:0.85},
  {suffix:"Moor",    code:"MOR", tough:3, mix:{flat:3,hill:4,uneven:4,longGrass:3,mud:2},  exposure:0.70},
];
/* which course characters a club in this league might own */
const TIER_TOUGH = [0,1,2,3,3];

/* ---- league structure ---------------------------------------- */
const TIERS = [
  {name:"Village Fun Run League", short:"VILLAGE",  base:34, spread:9,  prize:1.0},
  {name:"District League",        short:"DISTRICT", base:47, spread:9,  prize:2.0},
  {name:"County League",          short:"COUNTY",   base:59, spread:8,  prize:3.4},
  {name:"Regional League",        short:"REGIONAL", base:71, spread:8,  prize:5.0},
  {name:"National League",        short:"NATIONAL", base:84, spread:7,  prize:7.0},
];
/* How much a rival club improves each season it stays in a league.
   The big clubs are full-time setups that keep developing, so the
   National League never becomes a procession - you have to keep
   getting better just to stay with them.                          */
const RIVAL_GROWTH = [1.4, 2.0, 2.8, 3.6, 4.6];
const TEAMS_PER_LEAGUE = 6;
const WEEKS_PER_SEASON = 6;
const SQUAD_SIZE = 10;
const TRAINING_SLOTS = 3;
const POINTS = [10,8,6,4,2,1];              // points by finishing position
const RACE_PRIZE = [140,90,55,30,15,0];     // base prize by position (x tier multiplier)
const LEAGUE_PRIZE = [700,380,200,110,60,0];// end of season bonus by final position

/* ---- terrain plots you can buy (training facilities) ---------- */
const PLOTS = [
  {id:"track",   stat:"speed",     name:"Cinder Track",      cost:0,    desc:"A worn old track behind the clubhouse.",       start:true},
  {id:"gym",     stat:"fitness",   name:"Fitness Trail",     cost:0,    desc:"A lapped trail for endurance work.",           start:true},
  {id:"grass",   stat:"longGrass", name:"Long Grass Meadow", cost:450,  desc:"Unmown meadow. Teaches high knees."},
  {id:"mudpit",  stat:"mud",       name:"Mud Pit",           cost:600,  desc:"A churned, waterlogged field."},
  {id:"sprint",  stat:"sprint",    name:"Sprint Straight",   cost:700,  desc:"A short flat-out finishing straight."},
  {id:"hills",   stat:"hills",     name:"Hill Circuit",      cost:850,  desc:"A brutal repeating climb."},
  {id:"rough",   stat:"uneven",    name:"Uneven Trail",      cost:950,  desc:"Rutted, rock-strewn, ankle-testing."},
  {id:"ridge",   stat:"wind",      name:"Exposed Ridge",     cost:1100, desc:"Nowhere to hide from the wind."},
];
const PLOT_BY_STAT = {}; PLOTS.forEach(p=>PLOT_BY_STAT[p.stat]=p);
const FACILITY_BONUS = 3;      // permanent stat bonus for owning that terrain
const PLOT_MAX_LEVEL = 5;      // how many times you can buy the same ground
/* Extra pieces of the same ground give a fast-diminishing stat bonus -
   otherwise stacking terrain becomes a blunt boost that wins away races
   too, which is not what it is for. What they really buy is a better
   facility: more of that ground in your home course, and better
   training on it.                                                    */
const FACILITY_STEPS = [0, 3, 4.5, 5.5, 6.3, 7.0];
const TRAIN_QUALITY  = 0.14;   // per extra level, how much better sessions are
const HOME_FACILITY_MULT = 2;  // ...which counts double on your own ground

/* ---- home advantage --------------------------------------------
   Both of these lift your runners' attributes, not their raw speed.
   A flat 8% on speed would be enormous - the whole speed attribute,
   0 to 100, is only worth a 16% swing - so "8% better at home" is
   applied to what the runners are made of instead.               */
const HOME_BOOST  = 0.08;   // racing on your own ground
const STAND_BOOST = 0.02;   // ...and each stand you put up behind them

/* ---- infrastructure ---------------------------------------------
   Everything here can be bought over and over - the whole point is
   to keep building the ground bigger. Each one you own costs more
   than the last.
     boost   : extra home advantage per unit
     ticket  : money per HOME race, picked at random inside the range
     weekly  : money every race week (home or away)
     tv      : money per race, and it climbs steeply with the league
     grows   : income multiplies the longer you have owned it
     gateUp  : lifts ticket income by this much per unit             */
const INFRA = [
  {id:"stand", name:"Grandstand", base:2500, growth:1.55, max:14,
   boost:STAND_BOOST, ticket:[140,380], homeOnly:true,
   desc:"More seats, more noise. Every stand lifts the squad at home and sells more tickets."},

  {id:"foodtruck", name:"Food Truck Pitch", base:900, growth:1.34, max:12,
   weekly:[35,95], homeMult:3, tierScale:0.25,
   desc:"They pay you for the pitch. A few quid every week, proper money on home race day."},

  {id:"giftshop", name:"Club Gift Shop", base:2500, growth:1.5, max:8,
   weekly:[55,95], homeMult:3, tierScale:0.45,
   desc:"Vests, bobble hats and mugs. Ticks over all week, roaring trade on race day."},

  {id:"band", name:"Live Band", base:3500, growth:1.5, max:8,
   gateUp:0.18, weekly:[20,60], tierScale:0.3,
   desc:"People come for the day out, not just the running. Sells a lot more tickets."},

  {id:"social", name:"Social Media Team", base:5000, growth:1.6, max:8,
   weekly:[190,290], tierScale:0.5,
   desc:"Clips, highlights, sponsors sliding into the inbox. Mid price, earns very well."},

  {id:"bigscreen", name:"Big Screen", base:9000, growth:1.7, max:6,
   weekly:[45,75], tierScale:0.3, grows:0.40,
   desc:"Slow to pay for itself, but the advertising on it is worth more every season you own it."},

  {id:"camera", name:"Camera Crew & Rig", base:18000, growth:1.8, max:6,
   tv:[180,320], tierScale:1.35,
   desc:"Brutally expensive. But broadcasters pay for cross country, and they pay far more the higher you climb."},
];
const INFRA_BY_ID = {}; INFRA.forEach(i=>INFRA_BY_ID[i.id]=i);
const PLOT_GROWTH = 1.7;    // each extra piece of the same terrain costs more

/* ---- shoes ---------------------------------------------------- */

function makeRunner(mean, spread, archetype, usedNames){
  const stats={};
  for(const k of STAT_KEYS){
    let v = mean + gauss()*spread;
    if(archetype){
      if(archetype.up.includes(k))   v += 14 + rnd(8);
      if(archetype.down.includes(k)) v -= 12 + rnd(8);
    }
    stats[k]=clamp(Math.round(v),5,99);
  }
  // no two runners in the same squad share a surname
  let first=pick(FIRST), last=pick(LAST), tries=0;
  while(usedNames && usedNames.has(last) && tries++<40) last=pick(LAST);
  if(usedNames) usedNames.add(last);
  return {
    id:uid(),
    name: first+" "+last,
    stats,
    shoeUid:null,          // which pair of shoes from the inventory
    tactic: DEFAULT_TACTIC,
    age: ri(17,29),
    archetype: archetype?archetype.name:"Runner",
  };
}

function makeSquad(mean, spread, withArchetypes){
  const arcs = withArchetypes ? shuffle(ARCHETYPES.slice()).slice(0,SQUAD_SIZE) : [];
  const squad=[], used=new Set();
  for(let i=0;i<SQUAD_SIZE;i++) squad.push(makeRunner(mean,spread, withArchetypes?arcs[i]:null, used));
  return squad;
}

/* ---- course generation ---------------------------------------
   Builds a closed loop path from a seeded wobbly ellipse, splits
   it into 16 terrain segments, and records cumulative distances. */
function buildCourse(venue, seed){
  const rng = mulberry32(seed);
  const N = 13;                     // control points
  const ctrl=[];
  for(let i=0;i<N;i++){
    const a = (i/N)*Math.PI*2;
    const r = 0.60 + rng()*0.40;
    ctrl.push({x:Math.cos(a)*r, y:Math.sin(a)*r*0.74});
  }
  // Catmull-Rom sampling for a smooth closed loop
  const pts=[];
  const STEPS=16;
  for(let i=0;i<N;i++){
    const p0=ctrl[(i-1+N)%N],p1=ctrl[i],p2=ctrl[(i+1)%N],p3=ctrl[(i+2)%N];
    for(let s=0;s<STEPS;s++){
      const t=s/STEPS, t2=t*t, t3=t2*t;
      pts.push({
        x:0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
        y:0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3),
      });
    }
  }
  // cumulative length in normalised units
  const cum=[0];
  for(let i=1;i<=pts.length;i++){
    const a=pts[i-1], b=pts[i%pts.length];
    cum.push(cum[i-1]+Math.hypot(b.x-a.x,b.y-a.y));
  }
  const totalNorm = cum[pts.length];

  // 16 terrain segments from the venue's mix
  const SEGS=16;
  const bag=[];
  for(const k in venue.mix) for(let i=0;i<venue.mix[k];i++) bag.push(k);
  while(bag.length<SEGS) bag.push("flat");
  bag.length=SEGS;
  shuffle(bag,rng);
  // group identical neighbours a little so it reads as real terrain
  for(let pass=0;pass<2;pass++){
    for(let i=1;i<SEGS-1;i++){
      if(bag[i]!==bag[i-1] && bag[i+1]===bag[i-1] && rng()<0.6){
        [bag[i],bag[i+1]]=[bag[i+1],bag[i]];
      }
    }
  }
  const expCount = Math.round(venue.exposure*SEGS);
  const expStart = (rng()*SEGS)|0;
  const segments=[];
  for(let i=0;i<SEGS;i++){
    let exposed=false;
    for(let j=0;j<expCount;j++) if((expStart+j)%SEGS===i) exposed=true;
    segments.push({terrain:bag[i], exposed, from:i/SEGS, to:(i+1)/SEGS});
  }

  return {
    venue:venue.name, code:venue.code, lengthM:venue.len,
    infra: venue.infra || null,
    pts, cum, totalNorm, segments,
    segAt(frac){
      let f=frac%1; if(f<0)f+=1;
      return segments[Math.min(SEGS-1,(f*SEGS)|0)];
    },
    // position on the loop for a 0..1 fraction of a lap
    posAt(frac){
      let f=frac%1; if(f<0)f+=1;
      const target=f*totalNorm;
      let lo=0,hi=pts.length;
      while(lo<hi){ const mid=(lo+hi)>>1; if(cum[mid]<target)lo=mid+1; else hi=mid; }
      const i=clamp(lo-1,0,pts.length-1);
      const a=pts[i], b=pts[(i+1)%pts.length];
      const segLen=cum[i+1]-cum[i] || 1e-6;
      const t=clamp((target-cum[i])/segLen,0,1);
      return {x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t, ang:Math.atan2(b.y-a.y,b.x-a.x)};
    },
    mixSummary(){
      const c={};
      segments.forEach(s=>{ c[s.terrain]=(c[s.terrain]||0)+1; });
      return c;
    },
    exposedCount(){ return segments.filter(s=>s.exposed).length; }
  };
}

/* the first word of a club name, used to name its home ground */
function clubPlace(name){
  return name.replace(/\b(AC|Harriers|Runners|Striders|Athletic|Pacers|Club|Trail|Fell)\b/g,"")
             .trim().split(/\s+/)[0] || name.split(/\s+/)[0];
}

/* the course characters a club in this league might own */
function venueTypesForTier(tier){
  const want = TIER_TOUGH[clamp(tier,0,TIERS.length-1)];
  const pool = VENUE_TYPES.filter(v=>v.tough<=want+1 && v.tough>=want-1);
  return pool.length?pool:VENUE_TYPES.slice();
}

/* give a club a home ground with real character, gated by league */
function makeVenueFor(clubName, tier, type){
  const t = type || pick(venueTypesForTier(tier));
  return {
    name: clubPlace(clubName)+" "+t.suffix,
    code: t.code,
    len: 1200 + tier*110 + ri(0,180),
    mix: Object.assign({}, t.mix),
    exposure: clamp(t.exposure + rnd(0.10,-0.05), 0, 0.95),
  };
}

/* YOUR home ground is built from the terrain you have bought.
   Every plot you own puts that ground into your own course - which
   is also the ground you train on, so home is a real advantage. */
const PLOT_TERRAIN = {mud:"mud", hills:"hill", longGrass:"longGrass", uneven:"uneven"};
function playerHomeVenue(){
  const mix = {flat:16};
  let owned = 0;
  // every piece of terrain you own puts more of that ground in your loop
  PLOTS.forEach(p=>{
    const lvl = plotLevel(p.id);
    const terr = PLOT_TERRAIN[p.stat];
    if(!lvl || !terr) return;
    const want = Math.min(3*lvl, 6);          // one terrain can't swallow the loop
    mix[terr] = (mix[terr]||0) + want;
    mix.flat -= want;
    owned++;
  });
  if(mix.flat<1){
    // too much bought - trim the biggest sections back so it still adds up
    let over = 1-mix.flat;
    const keys = Object.keys(mix).filter(k=>k!=="flat").sort((a,b)=>mix[b]-mix[a]);
    while(over>0 && keys.length){
      for(const k of keys){ if(over<=0) break; if(mix[k]>2){ mix[k]--; over--; } }
      if(keys.every(k=>mix[k]<=2)) break;
    }
    mix.flat = 1;
  }
  return {
    name: clubPlace(state.club.name)+" Home Ground",
    code: "HOM",
    len: 1300 + state.tier*90,
    mix,
    // an exposed ridge in the grounds means the wind gets in
    exposure: ownsPlotFor("wind") ? 0.55 : 0.10,
    home: true,
    plotsBuilt: owned,
    infra: Object.assign({}, state.buildings||{}),
  };
}

function hashStr(s){
  let h=2166136261;
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  return h>>>0;
}

/* ---- rival club generation ----------------------------------- */
function makeRivals(tier, count, exclude){
  const pool = CLUB_NAMES.filter(c=>!exclude.includes(c[0]));
  shuffle(pool);
  const t = TIERS[tier];
  // deal out distinct course characters so no two clubs in a league
  // run on the same kind of ground
  const venuePool = shuffle(venueTypesForTier(tier).slice());
  const out=[];
  for(let i=0;i<count;i++){
    const [name,code,col] = pool[i%pool.length];
    // each club has its own strength offset so the table isn't flat
    const offset = (i - (count-1)/2) * (t.spread*0.42) + gauss()*2;
    out.push({
      id:uid(), name, code, colour:col, isPlayer:false,
      strength: t.base + offset,
      runners: makeSquad(t.base+offset, t.spread*0.55, true),
      venue: makeVenueFor(name, tier, venuePool[i%venuePool.length]),
    });
  }
  return out;
}

/* Effective stats = base + shoes + owned training facilities */
function effectiveStats(runner, ctx){
  const eff={};
  const shoe = ctx && ctx.shoeFor ? ctx.shoeFor(runner) : null;
  for(const k of STAT_KEYS){
    let v = runner.stats[k];
    if(shoe && shoe.mods[k]) v += shoe.mods[k];
    if(ctx && ctx.facility && ctx.facility[k]) v += ctx.facility[k];
    if(ctx && ctx.boost) v *= ctx.boost;      // home crowd behind them
    eff[k] = clamp(v,1,100);
  }
  return eff;
}

/* Can this runner actually pull off what you asked for? Rolled once,
   before they take the baton. Better runners get it wrong less often,
   but nobody is immune. */
function rollExecution(tac, eff){
  const skill = eff[tac.stat] || 50;
  const botch = tac.risk * (1 - skill/130) * 0.8;
  const r = Math.random();
  if(r < botch)                  return "bad";
  if(r < botch + tac.risk*0.70)  return "ok";
  return "good";
}
/* what the tactic actually does, once execution is taken into account */
function tacticProfile(tac, exec){
  if(exec==="good") return {dev:1.00, drain:tac.drain,                 kick:tac.kick};
  if(exec==="ok")   return {dev:0.60, drain:1+(tac.drain-1)*0.80,      kick:1+(tac.kick-1)*0.50};
  // botched: they went and did it anyway, paid for it, and got nothing back
  return              {dev:1.00, drain:1+(tac.drain-1)*1.50+0.10, kick:Math.min(1,tac.kick*0.70)};
}

function makeRaceRunner(runner, ctx){
  const eff = effectiveStats(runner,ctx);
  const tac = tacticOf(runner);
  const exec = rollExecution(tac, eff);
  return {
    ref:runner,
    name:runner.name,
    eff,
    tactic:tac,
    exec,
    prof:tacticProfile(tac,exec),
    form: 1 + gauss()*0.028,          // how they've turned up on the day
    phase: Math.random()*6.283,
    weaveF: 0.16 + Math.random()*0.26,   // nobody runs a ruler-straight line,
    weaveA: 0.12 + Math.random()*0.20,   // and everybody wanders differently
    lost:{},                          // seconds lost, by stat key
    sprintGain:0,
    staminaEnd:100,
    legTime:0,
    boxedFor:0,                       // seconds spent stuck behind someone
    ran:false,
  };
}

function newRace(course, entries){
  // entries: [{club, order:[runner...], ctx}]
  const R = {
    course, t:0, over:false, finishOrder:[], teams:[],
  };
  entries.forEach(e=>{
    R.teams.push({
      club:e.club,
      name:e.club.name, code:e.club.code, colour:e.club.colour,
      isPlayer:!!e.club.isPlayer,
      runners:e.order.map(r=>makeRaceRunner(r,e.ctx)),
      leg:0, dist:0, total:0, stamina:100, lastSpeed:BASE_SPEED,
      legStart:0, done:false, finishTime:0, place:0, handover:-99,
      lane:0, blocked:false,
    });
  });
  return R;
}

function stepRace(R, dt){
  if(R.over) return;
  R.t += dt;
  const L = R.course.lengthM;

  for(const tm of R.teams){
    if(tm.done) continue;
    const r = tm.runners[tm.leg];
    r.ran = true;
    const frac = tm.dist / L;
    const seg = R.course.segAt(frac);

    // --- the speed formula -------------------------------------
    const B = B_MIN + B_RANGE*(r.eff.speed/100);          // general pace
    let T = 1, tstat = null, Tmax = 1;
    if(seg.terrain !== "flat"){
      tstat = TERRAIN[seg.terrain].stat;
      // The ground churns up leg by leg - and worst of all on the inside,
      // because that is the line everybody runs. Out wide the going is
      // longer but fresher, which is a real trade on soft ground.
      const wear  = (CHURN[seg.terrain]||0)*(tm.leg/(SQUAD_SIZE-1))
                  * (1 - LANE_CHURN*tm.lane);
      const churn = 1 - wear;
      T    = T_MIN + T_RANGE*(r.eff[tstat]/100)*churn;    // terrain skill
      Tmax = T_MIN + T_RANGE*churn;                       // same, at stat 100
    }
    let W = 1;
    if(seg.exposed) W = W_MIN + W_RANGE*(r.eff.wind/100); // headwind
    const Fa = tm.stamina>=FA_KNEE ? 1
             : FA_FLOOR + (1-FA_FLOOR)*(tm.stamina/FA_KNEE);   // fatigue
    let S = 1;
    if(frac > SPRINT_ZONE)
      S = 1 + SPRINT_GAIN*r.prof.kick*(r.eff.sprint/100)*((frac-SPRINT_ZONE)/(1-SPRINT_ZONE));
    const wob = 1 + Math.sin(R.t*0.11 + r.phase)*0.012;   // small live variance

    // --- tactics: how hard they are running right now -----------
    const E = 1 + (r.tactic.effort(frac) - 1) * r.prof.dev;

    // --- racing line --------------------------------------------
    // Someone just ahead on your line is in your way until you pull out.
    let blocked = false, jostle = 0;
    const myIdx = R.teams.indexOf(tm);
    for(let i=0;i<R.teams.length;i++){
      const o = R.teams[i];
      if(o===tm || o.done) continue;
      const gap = o.total - tm.total;
      if(gap>0 && gap<BLOCK_GAP && Math.abs(o.lane-tm.lane)<BLOCK_LANE) blocked = true;
      // anyone running right alongside gets leaned away from
      if(Math.abs(gap)<JOSTLE_GAP && Math.abs(o.lane-tm.lane)<JOSTLE_LANE){
        const diff = tm.lane - o.lane;
        jostle += (diff===0 ? (myIdx<i?-1:1) : Math.sign(diff)) * JOSTLE_PUSH;
      }
    }
    tm.blocked = blocked;
    if(blocked) r.boxedFor += dt;
    let want = r.tactic.lane
             + Math.sin(R.t*r.weaveF + r.phase)*r.weaveA          // their own wander
             + clamp(jostle,-0.5,0.5);                            // and the elbows
    if(blocked) want = clamp(want + BLOCK_SWING, -1, 1);          // swing out to get round
    tm.lane += clamp(want - tm.lane, -LANE_DRIFT*dt, LANE_DRIFT*dt);
    // a little headroom past the nominal edges, so a runner committed to
    // the rail still has room to weave instead of being pinned flat
    tm.lane = clamp(tm.lane, -LANE_MAX, LANE_MAX);
    const LN = 1 - LANE_GAIN*tm.lane;          // the inside is the shorter way round
    const BK = blocked ? BLOCK_COST : 1;

    const v = BASE_SPEED * B * T * W * Fa * S * r.form * wob * E * LN * BK;
    const d = v*dt;
    const tickTime = d/v;                                 // == dt, kept explicit

    // --- telemetry ------------------------------------------------
    // Every category is measured the same way: the seconds this runner
    // would have saved right here if that one attribute were 100.
    if(tstat) r.lost[tstat] = (r.lost[tstat]||0) + tickTime*(1 - T/Tmax);
    if(seg.exposed) r.lost.wind = (r.lost.wind||0) + tickTime*(1 - W/(W_MIN+W_RANGE));
    if(Fa<1)  r.lost.fitness = (r.lost.fitness||0) + tickTime*(1-Fa);
    r.lost.speed = (r.lost.speed||0) + tickTime*(1 - B/(B_MIN+B_RANGE));
    if(S>1)   r.sprintGain += tickTime*(S-1);

    // --- stamina ------------------------------------------------
    const drain = STAM_DRAIN
                * (FIT_DRAIN_MIN - FIT_DRAIN_RANGE*(r.eff.fitness/100))
                * TERRAIN[seg.terrain].drain
                * (seg.exposed?1.08:1)
                * r.prof.drain;
    tm.stamina = Math.max(0, tm.stamina - drain*dt);

    tm.dist += d; tm.total += d; tm.lastSpeed = v;

    // --- baton change -------------------------------------------
    if(tm.dist >= L){
      r.legTime = R.t - tm.legStart;
      r.staminaEnd = tm.stamina;
      tm.legStart = R.t;
      tm.dist -= L;
      tm.leg++;
      tm.stamina = 100;
      tm.handover = R.t;
      if(tm.leg >= SQUAD_SIZE){
        tm.done = true;
        tm.finishTime = R.t;
        tm.leg = SQUAD_SIZE-1;
        tm.dist = L;
        R.finishOrder.push(tm);
        tm.place = R.finishOrder.length;
      }
    }
  }
  if(R.teams.every(t=>t.done)) R.over = true;
}

/* live standings: finished teams first, then by distance covered */
function standings(R){
  return R.teams.slice().sort((a,b)=>{
    if(a.done&&b.done) return a.finishTime-b.finishTime;
    if(a.done) return -1;
    if(b.done) return 1;
    return b.total-a.total;
  });
}

/* run the whole race with no animation (used for balance testing) */
function simulateToEnd(R, dt=0.25){
  let guard=0;
  while(!R.over && guard++ < 400000) stepRace(R,dt);
  return R;
}

/* ---- squad-wide analysis of a finished race ------------------- */
function analyseTeam(tm){
  const lost={}; STAT_KEYS.forEach(k=>lost[k]=0);
  let sprintGain=0, emptyLegs=0, worstBy={};
  tm.runners.forEach(r=>{
    for(const k in r.lost) lost[k]=(lost[k]||0)+r.lost[k];
    sprintGain += r.sprintGain;
    if(r.staminaEnd < 12) emptyLegs++;
    for(const k in r.lost){
      if(!worstBy[k] || r.lost[k] > worstBy[k].secs) worstBy[k]={runner:r, secs:r.lost[k]};
    }
  });
  const avgStamina = tm.runners.reduce((a,r)=>a+r.staminaEnd,0)/tm.runners.length;
  return {lost, sprintGain, emptyLegs, worstBy, avgStamina};
}

/* ================================================================
   SECTION 5 : PIXEL RENDERER (top-down view of the whole loop)
   ================================================================ */
const CW = 400, CH = 232;          // internal canvas resolution
const RUNNER_SCALE = 2;            // runner sprites are 5x8 px, drawn at this scale
const TRACK = {x:4, y:22, w:278, h:206};
const PANEL = {x:288, y:22, w:108, h:206};

function drawText(ctx, str, x, y, col, scale){
  scale = scale||1;
  str = String(str).toUpperCase();
  ctx.fillStyle = col;
  for(let i=0;i<str.length;i++){
    const g = GLYPHS[str[i]] || GLYPHS[" "];
    const ox = x + i*6*scale;
    for(let p=0;p<g.length;p++) ctx.fillRect(ox+g[p][0]*scale, y+g[p][1]*scale, scale, scale);
  }
}
const textW = (s,sc)=>String(s).length*6*(sc||1);

function drawRunnerSprite(ctx, x, y, frame, colour, halo, scale){
  const px = SPRITES[frame & 3];
  const S = scale || RUNNER_SCALE;
  const bx = Math.round(x)-2*S, by = Math.round(y)-7*S;
  if(halo){
    ctx.fillStyle = halo;
    for(let i=0;i<px.length;i++){
      const sx=bx+px[i][0]*S, sy=by+px[i][1]*S;
      ctx.fillRect(sx-S,sy,S,S); ctx.fillRect(sx+S,sy,S,S);
      ctx.fillRect(sx,sy-S,S,S); ctx.fillRect(sx,sy+S,S,S);
    }
  }
  ctx.fillStyle="#05070a"; ctx.fillRect(bx,by+7*S,4*S,S);   // shadow
  for(let i=0;i<px.length;i++){
    const c = px[i][2];
    ctx.fillStyle = c==="H" ? "#eccfa4" : (c==="B" ? colour : "#252b38");
    ctx.fillRect(bx+px[i][0]*S, by+px[i][1]*S, S, S);
  }
}

/* ---- the buildings on your own ground --------------------------
   Everything you have built is drawn round the outside of the loop,
   oriented to the track, so the ground grows as you spend on it.  */
const CROWD_COLS =["#e0574a","#4f9de0","#f5c542","#5fd35f","#d9e2f2","#9b6fd4","#e08a3c","#48c2a8"];

/* Draw one building at a point around the loop, oriented to the track
   and standing just off the outside of it. */
function atLoop(course, view, frac){
  const a = course.posAt(frac);
  const p = proj(view, a);
  const tx = Math.cos(a.ang), ty = Math.sin(a.ang);
  const ox = -Math.cos(a.ang+Math.PI/2), oy = -Math.sin(a.ang+Math.PI/2);
  return (u,v)=>({x:Math.round(p.x+tx*u+ox*v), y:Math.round(p.y+ty*u+oy*v)});
}

function drawGround(c, course, view){
  const infra = course.infra;
  if(!infra) return;
  const rng = mulberry32(hashStr(course.venue)+7);
  const put = (px,u,v,col)=>{ const q=px(u,v); c.fillStyle=col; c.fillRect(q.x,q.y,1,1); };

  // ---- stands, spread round the loop from the finish line ----------
  const stands = Math.min(infra.stand||0, 10);
  for(let s=0; s<stands; s++){
    const px = atLoop(course, view, (s*0.107) % 1);
    const len = 18 + Math.min(s,4)*2, dep = 8, rows = 3;
    const front = 13;
    for(let u=-len/2; u<=len/2; u++){
      for(let v=0; v<dep; v++){
        put(px,u,front+v, v<rows
          ? (rng()<0.55 ? CROWD_COLS[(rng()*CROWD_COLS.length)|0] : "#39465f")
          : (v===rows ? "#39465f" : ((u%2===0)?"#39424f":"#2e3846")));
      }
    }
    for(let u=-len/2; u<=len/2; u++) put(px,u,front+dep,"#1d2430");
    // floodlights once the ground is getting serious
    if(stands>=4 && s%2===0){
      [-len/2-3, len/2+3].forEach(u=>{
        for(let v=0;v<4;v++) put(px,u,front+2+v,"#5a6a86");
        const q=px(u,front+6); c.fillStyle="#fff8c0"; c.fillRect(q.x-1,q.y-1,3,2);
      });
    }
  }

  // ---- food trucks -------------------------------------------------
  const trucks = Math.min(infra.foodtruck||0, 8);
  for(let t=0; t<trucks; t++){
    const px = atLoop(course, view, (0.055 + t*0.113) % 1);
    const body = ["#e0574a","#48c2a8","#f5c542","#4f9de0"][t%4];
    for(let u=0;u<9;u++) for(let v=0;v<6;v++){
      put(px,u-4,13+v, v<2 ? ((u%2===0)?"#f5e6c8":body)       // awning
                    : (v===5 ? "#20242e"                       // wheels/shadow
                    : (u<2 ? "#8a93a5" : body)));              // cab / body
    }
  }

  // ---- gift shop ---------------------------------------------------
  const shops = Math.min(infra.giftshop||0, 4);
  for(let g=0; g<shops; g++){
    const px = atLoop(course, view, (0.035 + g*0.09) % 1);
    for(let u=0;u<7;u++) for(let v=0;v<6;v++){
      put(px,u+6,13+v, v<2 ? ((u%2===0)?"#e0574a":"#f5e6c8") : (v===5?"#2e3846":"#6b5340"));
    }
  }

  // ---- big screen : tall panel with a bright face -------------------
  const screens = Math.min(infra.bigscreen||0, 4);
  for(let s=0; s<screens; s++){
    const px = atLoop(course, view, (0.52 + s*0.08) % 1);
    for(let u=-9;u<=9;u++) for(let v=0;v<11;v++){
      let col;
      if(v<2) col = "#20242e";                                  // legs/base
      else if(v>=9) col = "#1d2430";                            // top housing
      else col = (rng()<0.12) ? "#8fd0ff" : "#2a4a6a";          // the picture
      put(px,u,15+v,col);
    }
    for(let u=-9;u<=9;u++) put(px,u,15+11,"#39465f");
  }

  // ---- live band : a stage with a couple of figures ------------------
  const bands = Math.min(infra.band||0, 4);
  for(let b=0; b<bands; b++){
    const px = atLoop(course, view, (0.70 + b*0.06) % 1);
    for(let u=-7;u<=7;u++) for(let v=0;v<7;v++){
      put(px,u,14+v, v<1 ? "#7a4b8f" : (v>=6 ? "#20242e" : "#5a3a6b"));
    }
    [-4,0,4].forEach((u,i)=>{                                   // the band
      put(px,u,14+3,"#eccfa4"); put(px,u,14+4,CROWD_COLS[i%CROWD_COLS.length]);
    });
  }

  // ---- camera crew : a tower with a rig on top ----------------------
  const cams = Math.min(infra.camera||0, 4);
  for(let m=0; m<cams; m++){
    const px = atLoop(course, view, (0.34 + m*0.07) % 1);
    for(let v=0;v<9;v++){ put(px,-1,14+v,"#5a6a86"); put(px,1,14+v,"#5a6a86"); }
    for(let u=-3;u<=3;u++) for(let v=0;v<4;v++) put(px,u,23+v,"#39424f");
    put(px,3,24,"#20242e"); put(px,4,24,"#20242e");             // the lens
    put(px,0,26,"#e0574a");                                     // tally light
  }
}

/* a badge on the course itself when it is your own ground */
function drawHomeBadge(c){
  const label = "HOME COURSE";
  const w = textW(label)+8, x = TRACK.x+4, y = TRACK.y+4;
  c.fillStyle="#241f0d"; c.fillRect(x,y,w,15);
  c.fillStyle="#f5c542";
  c.fillRect(x,y,w,1); c.fillRect(x,y+14,w,1);
  c.fillRect(x,y,1,15); c.fillRect(x+w-1,y,1,15);
  drawText(c,label,x+4,y+4,"#f5c542");
}

/* the big title-card runner */
function drawHeroRunner(ctx, x, y, frame, colour, scale){
  const px = HERO[frame & 3], S = scale||6;
  const bx = Math.round(x) - 4*S, by = Math.round(y) - 12*S;
  // a dark halo so the figure lifts off the striped background
  ctx.fillStyle = "#0b0e14";
  for(let i=0;i<px.length;i++){
    const sx=bx+px[i][0]*S, sy=by+px[i][1]*S;
    ctx.fillRect(sx-S,sy,S,S); ctx.fillRect(sx+S,sy,S,S);
    ctx.fillRect(sx,sy-S,S,S); ctx.fillRect(sx,sy+S,S,S);
  }
  for(let i=0;i<px.length;i++){
    const ch = px[i][2];
    ctx.fillStyle = ch==="H" ? "#eccfa4" : (ch==="B" ? colour : "#8794ad");
    ctx.fillRect(bx+px[i][0]*S, by+px[i][1]*S, S, S);
  }
}

/* work out how to fit the loop into the track area */
function courseView(course){
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  course.pts.forEach(p=>{
    if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x;
    if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y;
  });
  const pad=14;
  const s = Math.min((TRACK.w-pad*2)/(maxX-minX), (TRACK.h-pad*2)/(maxY-minY));
  return {
    s,
    cx: TRACK.x + TRACK.w/2 - ((minX+maxX)/2)*s,
    cy: TRACK.y + TRACK.h/2 - ((minY+maxY)/2)*s,
  };
}
const proj = (view,p)=>({x:view.cx+p.x*view.s, y:view.cy+p.y*view.s});

/* draw the course once into an offscreen canvas */
function bakeCourse(course, view){
  const off = document.createElement("canvas");
  off.width=CW; off.height=CH;
  const c = off.getContext("2d");

  // ground
  c.fillStyle="#131a15"; c.fillRect(0,0,CW,CH);
  for(let i=0;i<220;i++){                      // scattered grass speckle
    const x=(Math.random()*CW)|0, y=(Math.random()*CH)|0;
    c.fillStyle = Math.random()<0.5?"#18231a":"#0f150f";
    c.fillRect(x,y,1,1);
  }

  const STEPS = 520;
  const pos=[];
  for(let i=0;i<STEPS;i++){
    const f=i/STEPS;
    const p=proj(view, course.posAt(f));
    pos.push({p, seg:course.segAt(f)});
  }
  // dark edging pass
  for(let i=0;i<STEPS;i++){
    const {p}=pos[i];
    const t=TERRAIN[pos[i].seg.terrain];
    c.fillStyle=t.edge;
    c.fillRect(Math.round(p.x)-10, Math.round(p.y)-10, 21, 21);
  }
  // terrain surface pass
  for(let i=0;i<STEPS;i++){
    const {p,seg}=pos[i];
    const t=TERRAIN[seg.terrain];
    c.fillStyle=t.col;
    c.fillRect(Math.round(p.x)-7, Math.round(p.y)-7, 15, 15);
  }
  // texture: mud splats, grass tufts, rocks, hill chevrons
  for(let i=0;i<STEPS;i+=3){
    const {p,seg}=pos[i];
    const x=Math.round(p.x), y=Math.round(p.y);
    const r=mulberry32(i*2654435761 + hashStr(course.venue))();
    if(seg.terrain==="mud" && r<0.55){ c.fillStyle="#5d3d22"; c.fillRect(x-2+((r*4)|0), y-2+((r*7)%4|0), 2,1); }
    else if(seg.terrain==="longGrass" && r<0.6){ c.fillStyle="#8ed15a"; c.fillRect(x-3+((r*7)|0), y-3+((r*11)%6|0),1,2); }
    else if(seg.terrain==="uneven" && r<0.5){ c.fillStyle="#6f6a5e"; c.fillRect(x-2+((r*5)|0), y-1,2,2); }
    else if(seg.terrain==="hill" && r<0.5){ c.fillStyle="#d3a05c"; c.fillRect(x-2,y-1,1,1); c.fillRect(x-1,y-2,1,1); c.fillRect(x,y-1,1,1); }
    else if(seg.terrain==="flat" && r<0.18){ c.fillStyle="#4a9c4f"; c.fillRect(x-1,y,1,1); }
  }
  // wind markers just outside exposed sections
  for(let i=0;i<STEPS;i+=13){
    const seg=pos[i].seg;
    if(!seg.exposed) continue;
    const f=i/STEPS;
    const a=course.posAt(f);
    const p=proj(view,a);
    const nx=Math.cos(a.ang+Math.PI/2), ny=Math.sin(a.ang+Math.PI/2);
    const x=Math.round(p.x+nx*15), y=Math.round(p.y+ny*15);
    c.fillStyle="#8fa8c9";
    c.fillRect(x-2,y,5,1); c.fillRect(x+1,y-1,1,1); c.fillRect(x+1,y+1,1,1);
  }
  // your own stand and gift shop, beside the finishing straight
  drawGround(c, course, view);
  // start / finish line
  const sp = course.posAt(0), spp = proj(view,sp);
  const nx=Math.cos(sp.ang+Math.PI/2), ny=Math.sin(sp.ang+Math.PI/2);
  for(let k=-8;k<=8;k++){
    const x=Math.round(spp.x+nx*k), y=Math.round(spp.y+ny*k);
    c.fillStyle = ((k+9)%2===0)?"#ffffff":"#1a1a1a";
    c.fillRect(x-1,y-1,2,2);
  }
  return off;
}

/* the live race view */
const RaceView = {
  canvas:null, ctx:null, race:null, baked:null, view:null,
  speed:34, running:false, raf:0, onDone:null, acc:0,

  attach(canvas){
    this.canvas=canvas;
    canvas.width=CW; canvas.height=CH;
    this.ctx=canvas.getContext("2d");
    this.ctx.imageSmoothingEnabled=false;
  },
  setRace(race){
    this.race=race;
    this.view=courseView(race.course);
    this.baked=bakeCourse(race.course,this.view);
    this.draw();
  },
  start(onDone){
    this.onDone=onDone; this.running=true; this.acc=0;
    let last=performance.now();
    const tick=(now)=>{
      if(!this.running) return;
      const real=Math.min(0.1,(now-last)/1000); last=now;
      this.acc += real*this.speed;
      let guard=0;
      while(this.acc>0.25 && !this.race.over && guard++<4000){ stepRace(this.race,0.25); this.acc-=0.25; }
      this.draw();
      if(this.race.over){ this.running=false; if(this.onDone) this.onDone(); return; }
      this.raf=requestAnimationFrame(tick);
    };
    this.raf=requestAnimationFrame(tick);
  },
  stop(){ this.running=false; cancelAnimationFrame(this.raf); },
  skip(){
    this.stop();
    simulateToEnd(this.race);
    this.draw();
    if(this.onDone) this.onDone();
  },

  draw(){
    const R=this.race, c=this.ctx;
    if(!R||!c) return;
    c.fillStyle="#0b0e14"; c.fillRect(0,0,CW,CH);
    c.drawImage(this.baked,0,0);

    // --- header ---------------------------------------------------
    c.fillStyle="#151b28"; c.fillRect(0,0,CW,20);
    c.fillStyle="#39465f"; c.fillRect(0,20,CW,1);
    const me = R.teams.find(t=>t.isPlayer);
    drawText(c, R.course.venue.slice(0,22), 4, 7, "#f5c542");
    if(R.course.isHome) drawHomeBadge(c);
    const legTxt = "LEG "+Math.min(SQUAD_SIZE,(me?me.leg+1:1))+"/"+SQUAD_SIZE;
    drawText(c, legTxt, 190, 7, "#d9e2f2");
    drawText(c, fmtTime(R.t), CW-4-textW(fmtTime(R.t)), 7, "#8493ad");

    // --- runners on the loop -------------------------------------
    const ordered = standings(R).slice().reverse();   // leaders drawn on top
    ordered.forEach(tm=>{
      const f = tm.done ? 0 : tm.dist/R.course.lengthM;
      const a = R.course.posAt(f);
      const p = proj(this.view, a);
      if(tm.done){
        // parked at the finish, waving
        drawRunnerSprite(c, p.x+ (tm.place%2?10:-10), p.y+12, 0, tm.colour, null);
        return;
      }
      // Runners sit on their own racing line. The path normal points
      // INTO the loop, so a negative lane (the inside line) has to be
      // negated here or the inside tactic draws them out wide.
      const nudge = (R.teams.indexOf(tm) - (R.teams.length-1)/2) * 0.9;
      const lane = -(tm.lane*LANE_PIXELS + nudge);
      p.x += Math.cos(a.ang+Math.PI/2)*lane;
      p.y += Math.sin(a.ang+Math.PI/2)*lane;
      const frame = ((tm.total/2.2)|0) & 3;
      drawRunnerSprite(c, p.x, p.y, frame, tm.colour, tm.isPlayer?"#ffffff":null);
      if(tm.isPlayer){
        c.fillStyle="#f5c542";
        const S=RUNNER_SCALE;
        const ax=Math.round(p.x), ay=Math.round(p.y)-9*S;
        c.fillRect(ax-2*S,ay,5*S,S); c.fillRect(ax-S,ay+S,3*S,S); c.fillRect(ax,ay+2*S,S,S);
      }
      // handover flash
      if(R.t-tm.handover < 2.5){
        c.fillStyle= (((R.t*6)|0)%2) ? "#ffffff" : tm.colour;
        drawText(c,"GO!",Math.round(p.x)-8,Math.round(p.y)-13*RUNNER_SCALE,c.fillStyle);
      }
    });

    // --- standings panel -----------------------------------------
    c.fillStyle="#0e1320"; c.fillRect(PANEL.x-2,PANEL.y,PANEL.w+4,PANEL.h);
    c.fillStyle="#39465f"; c.fillRect(PANEL.x-2,PANEL.y,PANEL.w+4,1);
    c.fillRect(PANEL.x-2,PANEL.y+PANEL.h-1,PANEL.w+4,1);
    c.fillRect(PANEL.x-2,PANEL.y,1,PANEL.h);
    drawText(c,"STANDINGS",PANEL.x+2,PANEL.y+5,"#f5c542");
    const st=standings(R);
    const leader=st[0];
    st.forEach((tm,i)=>{
      const y=PANEL.y+18+i*16;
      c.fillStyle = tm.isPlayer ? "#26304a" : "#121826";
      c.fillRect(PANEL.x, y-3, PANEL.w, 14);
      c.fillStyle=tm.colour; c.fillRect(PANEL.x+1,y-3,2,14);
      drawText(c,(i+1)+"",PANEL.x+6,y,"#d9e2f2");
      drawText(c,tm.code,PANEL.x+18,y,tm.isPlayer?"#f5c542":"#d9e2f2");
      let gap="";
      if(tm.done) gap=fmtTime(tm.finishTime);
      else if(i===0) gap="LEAD";
      else {
        const behind=(leader.total-tm.total)/Math.max(1,tm.lastSpeed);
        gap="+"+behind.toFixed(0);
      }
      drawText(c,gap,PANEL.x+PANEL.w-2-textW(gap),y,"#8493ad");
      drawText(c,"L"+Math.min(SQUAD_SIZE,tm.leg+1),PANEL.x+6,y+7,"#5a6a86");
      // little stamina bar for each club
      const sw=40, sx=PANEL.x+30, sy=y+8;
      c.fillStyle="#222a3c"; c.fillRect(sx,sy,sw,3);
      const sv=tm.done?0:tm.stamina/100;
      c.fillStyle = sv>0.5?"#5fd35f":(sv>0.22?"#f5c542":"#e0574a");
      c.fillRect(sx,sy,Math.round(sw*sv),3);
    });

    // --- current player runner readout ---------------------------
    if(me){
      const r=me.runners[me.leg];
      c.fillStyle="#0e1320"; c.fillRect(TRACK.x,CH-22,TRACK.w,20);
      c.fillStyle="#39465f"; c.fillRect(TRACK.x,CH-22,TRACK.w,1);
      drawText(c,("LEG "+(me.leg+1)+" "+r.name).slice(0,30),TRACK.x+4,CH-17,"#d9e2f2");
      drawText(c,"STAM",TRACK.x+4,CH-9,"#5a6a86");
      const bx=TRACK.x+4+textW("STAM")+4, bw=86;
      c.fillStyle="#222a3c"; c.fillRect(bx,CH-8,bw,5);
      const sv=me.done?0:me.stamina/100;
      c.fillStyle = sv>0.5?"#5fd35f":(sv>0.22?"#f5c542":"#e0574a");
      c.fillRect(bx,CH-8,Math.round(bw*sv),5);
      const seg=R.course.segAt(me.dist/R.course.lengthM);
      const tn=TERRAIN[seg.terrain].name+(seg.exposed?" / WIND":"");
      drawText(c,tn,TRACK.x+TRACK.w-4-textW(tn),CH-9,TERRAIN[seg.terrain].col);
      // what they were told to do, and how it is going
      let tacTxt = r.tactic.short, tacCol = "#8fa8c9";
      if(me.blocked){ tacTxt = "BOXED IN"; tacCol = "#e0574a"; }
      else if(me.dist/R.course.lengthM > 0.45){
        if(r.exec==="bad"){ tacTxt = r.tactic.short+" GONE WRONG"; tacCol = "#e0574a"; }
        else if(r.exec==="good"){ tacCol = "#5fd35f"; }
      }
      drawText(c,tacTxt,TRACK.x+TRACK.w-4-textW(tacTxt),CH-17,tacCol);
    }
  }
};

/* ================================================================
   TRAINING SESSION VIEW
   The squad out on the ground you are training them on, working.
   ================================================================ */
const INTRO_SECONDS = 5.0;      // the little title card before they set off
const TRAIN_SECONDS = 9.5;      // how long the session itself takes to watch

const TrainView = {
  canvas:null, ctx:null, baked:null, view:null, course:null,
  t:0, running:false, raf:0, onDone:null, runners:[], pops:[], label:"",

  attach(canvas){
    this.canvas=canvas;
    canvas.width=CW; canvas.height=CH;
    this.ctx=canvas.getContext("2d");
    this.ctx.imageSmoothingEnabled=false;
  },
  setSession(course, rows, statKey, colour){
    this.course=course;
    this.view=courseView(course);
    this.baked=bakeCourse(course,this.view);
    this.label=STAT_BY_KEY[statKey].name.toUpperCase()+" SESSION";
    this.statKey=statKey;
    this.colour=colour;
    this.t=0;
    // stronger runners lap quicker, so the group strings out naturally
    this.runners = rows.map((row,i)=>({
      name:row.name,
      lap: 6.2 - (row.after/100)*1.6 + Math.random()*0.7,   // a steady session pace
      off: i/rows.length + Math.random()*0.03,
      phase: Math.random()*6.283,
    }));
    // a gain pops above a runner every so often through the session
    this.pops = rows.map((row,i)=>({
      i, at: 0.12 + (i/rows.length)*0.78 + Math.random()*0.05,
      text: "+"+row.gain.toFixed(1),
    }));
    this.draw();
  },
  start(onDone){
    this.onDone=onDone; this.running=true;
    let last=performance.now();
    const total = INTRO_SECONDS + TRAIN_SECONDS;
    const tick=(now)=>{
      if(!this.running) return;
      this.t += Math.min(0.1,(now-last)/1000); last=now;
      this.draw();
      if(this.t>=total){ this.running=false; if(this.onDone) this.onDone(); return; }
      this.raf=requestAnimationFrame(tick);
    };
    this.raf=requestAnimationFrame(tick);
  },
  stop(){ this.running=false; cancelAnimationFrame(this.raf); },
  /* Skip always goes straight to the results. Clicking the title card
     itself just gets the session under way early. */
  skip(){ this.stop(); if(this.onDone) this.onDone(); },
  skipIntro(){ if(this.running && this.t < INTRO_SECONDS){ this.t = INTRO_SECONDS; this.draw(); } },

  /* ---- the title card: a big runner and what today's session is ---- */
  drawIntro(){
    const c=this.ctx, t=this.t;
    c.fillStyle="#0b0e14"; c.fillRect(0,0,CW,CH);
    // scrolling retro stripes behind everything
    for(let y=0;y<CH;y+=4){
      const shift = ((t*26)|0) % 8;
      c.fillStyle = ((y+shift)%8===0) ? "#121a26" : "#0e1420";
      c.fillRect(0,y,CW,2);
    }
    // banner bars
    c.fillStyle="#151b28"; c.fillRect(0,26,CW,34); c.fillRect(0,CH-46,CW,30);
    c.fillStyle="#f5c542"; c.fillRect(0,26,CW,1); c.fillRect(0,59,CW,1);
    c.fillStyle="#39465f"; c.fillRect(0,CH-46,CW,1); c.fillRect(0,CH-17,CW,1);

    const s = STAT_BY_KEY[this.statKey];
    const title = s.name.toUpperCase();
    drawText(c,title,(CW-textW(title,3))/2,34,"#f5c542",3);
    drawText(c,"SESSION",(CW-textW("SESSION",2))/2,64,"#d9e2f2",2);

    // the man himself, mid-stride, front and centre
    drawHeroRunner(c, CW/2, 172, ((t*7)|0)&3, this.colour, 7);

    // where they are working, and the countdown to setting off
    const gr = this.course.venue;
    drawText(c,gr,(CW-textW(gr))/2,CH-41,"#8fa8c9");
    const left = Math.max(0, Math.ceil(INTRO_SECONDS - t));
    const go = left>0 ? String(left) : "GO";
    if(left>0 || ((t*6)|0)%2===0)
      drawText(c,go,(CW-textW(go,2))/2,CH-31,left>0?"#d9e2f2":"#5fd35f",2);

    // squad marching on at the bottom as a little parade
    for(let i=0;i<SQUAD_SIZE;i++){
      const x = ((t*26) + i*34) % (CW+40) - 20;
      drawRunnerSprite(c, x, CH-52, (((t*8)|0)+i)&3, this.colour, null, 1);
    }
  },

  draw(){
    const c=this.ctx; if(!c||!this.course) return;
    if(this.t < INTRO_SECONDS){ this.drawIntro(); return; }
    const tt = this.t - INTRO_SECONDS;
    const prog = clamp(tt/TRAIN_SECONDS,0,1);
    c.fillStyle="#0b0e14"; c.fillRect(0,0,CW,CH);
    c.drawImage(this.baked,0,0);

    // header
    c.fillStyle="#151b28"; c.fillRect(0,0,CW,20);
    c.fillStyle="#39465f"; c.fillRect(0,20,CW,1);
    drawText(c,this.label,4,7,"#f5c542");
    const gr = this.course.venue;
    drawText(c,gr,CW-4-textW(gr),7,"#8493ad");

    // the squad, working their way round
    this.runners.forEach((r,i)=>{
      const f = (tt/r.lap + r.off) % 1;
      const a = this.course.posAt(f);
      const p = proj(this.view,a);
      // spread them across the width of the path so it reads as a group
      const lane = Math.sin(tt*0.6 + r.phase)*2.5 + ((i%3)-1)*2.4;
      p.x += Math.cos(a.ang+Math.PI/2)*lane;
      p.y += Math.sin(a.ang+Math.PI/2)*lane;
      drawRunnerSprite(c, p.x, p.y, ((tt*6+i)|0)&3, this.colour, null);
      // the improvement popping up above them
      const pop = this.pops[i];
      if(pop && prog>=pop.at && prog<pop.at+0.16){
        drawText(c,pop.text,Math.round(p.x)-8,Math.round(p.y)-9*RUNNER_SCALE-4,"#5fd35f");
      }
    });

    // session progress
    const bw=CW-16;
    c.fillStyle="#0e1320"; c.fillRect(0,CH-22,CW,22);
    c.fillStyle="#39465f"; c.fillRect(0,CH-22,CW,1);
    drawText(c,"SESSION",8,CH-18,"#8493ad");
    const pct=Math.round(prog*100)+"%";
    drawText(c,pct,CW-8-textW(pct),CH-18,"#d9e2f2");
    c.fillStyle="#222a3c"; c.fillRect(8,CH-9,bw,5);
    c.fillStyle="#5fd35f"; c.fillRect(8,CH-9,Math.round(bw*prog),5);
  }
};

/* static preview of a course (used on the race preview screen) */
function drawCoursePreview(canvas, course){

  c.imageSmoothingEnabled=false;
