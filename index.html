}
/* ================================================================
   SECTION 6 : GAME STATE
   ================================================================ */
const SAVE_KEY = "xcmanager_save_v1";
const SAVE_VERSION = 4;

let state = null;
let liveRace = null;       // the running race object (never saved)
let liveCourse = null;
let liveTraining = null;   // the training session being watched (never saved)

function newGame(clubName){
  _uid = 1;
  const runners = makeSquad(42, 9, true);
  const inventory = runners.map(r=>{
    const pair = {uid:uid(), shoe:"trainers", wornBy:r.id};
    r.shoeUid = pair.uid;
    return pair;
  });
  state = {
    v:SAVE_VERSION,
    club:{id:uid(), name:clubName||"Hillside Harriers", code:makeCode(clubName||"Hillside Harriers"),
          colour:"#f5c542", isPlayer:true},
    money:500,
    season:1, week:0, tier:0,
    runners,
    order: runners.map(r=>r.id),
    plots: PLOTS.reduce((o,p)=>{ o[p.id] = p.start?1:0; return o; },{}),
    buildings: {},
    builtAt: {},
    inventory,
    slots: TRAINING_SLOTS,
    rivals: [],
    table: {},
    fixtures: [],
    lastResult: null,
    seasonEnd: null,
    screen:"squad",
    raceState:null,
    trainLog:[],
    uidSeed:0,
  };
  state.rivals = makeRivals(state.tier, TEAMS_PER_LEAGUE-1, [state.club.name]);
  resetTable();
  buildFixtures();
  save();
}

function makeCode(name){
  const words = name.toUpperCase().replace(/[^A-Z ]/g,"").split(/\s+/).filter(Boolean);
  if(words.length>=3) return words.slice(0,3).map(w=>w[0]).join("");
  return ((words[0]||"CLB")+"XX").slice(0,3);
}

const allClubs = ()=>[state.club, ...state.rivals];
const clubById = id=>allClubs().find(c=>c.id===id);

function resetTable(){
  state.table={};
  allClubs().forEach(c=>{ state.table[c.id]={pts:0, played:0, wins:0, best:99, totalPos:0}; });
}
/* Six races, six clubs: everyone hosts one round on their own ground,
   so exactly one race a season is at home and the rest are away on
   whatever the opposition runs on - bog, fell, ridge or gentle park. */
function buildFixtures(){
  const hosts = shuffle(allClubs().map(c=>c.id)).slice(0,WEEKS_PER_SEASON);
  // if the league is ever smaller than the season, wrap the host list
  while(hosts.length<WEEKS_PER_SEASON) hosts.push(hosts[hosts.length%allClubs().length]);
  state.fixtures = hosts.map((hostId,w)=>{
    const host = clubById(hostId);
    const venue = hostId===state.club.id ? playerHomeVenue() : host.venue;
    return {
      week:w, hostId,
      venue: venue.name, code: venue.code,
      home: hostId===state.club.id,
      result:null,
    };
  });
}
function sortedTable(){
  return allClubs().map(c=>({club:c, ...state.table[c.id]}))
    .sort((a,b)=> b.pts-a.pts || b.wins-a.wins || a.totalPos-b.totalPos || a.club.name.localeCompare(b.club.name));
}
function myTablePos(){
  return sortedTable().findIndex(r=>r.club.id===state.club.id)+1;
}

/* ---- player context: shoes + owned training facilities -------- */
function shoeFor(runner){
  const inv = state.inventory.find(i=>i.uid===runner.shoeUid);
  return inv ? SHOES[inv.shoe] : SHOES.trainers;
}
/* plots are stackable now: every extra piece of the same ground
   deepens the bonus and puts more of it into your home course */
const plotLevel = id => (state.plots && state.plots[id]) || 0;
const facilityBonusFor = lvl => FACILITY_STEPS[Math.min(lvl, FACILITY_STEPS.length-1)];
/* a deeper facility trains the squad harder */
function trainQuality(stat){
  const p = PLOT_BY_STAT[stat];
  const lvl = p ? plotLevel(p.id) : 0;
  return 1 + TRAIN_QUALITY*Math.max(0, lvl-1);
}
function plotCost(id){
  const p = PLOTS.find(x=>x.id===id);
  if(!p) return Infinity;
  const lvl = plotLevel(id);
  const base = p.cost || 600;               // the two you start with are free
  return Math.round(base * Math.pow(PLOT_GROWTH, lvl));
}
function facilityBonuses(atHome){
  const f={};
  const mult = atHome ? HOME_FACILITY_MULT : 1;
  PLOTS.forEach(p=>{
    const lvl = plotLevel(p.id);
    if(lvl) f[p.stat] = (f[p.stat]||0) + facilityBonusFor(lvl)*mult;
  });
  return f;
}
/* ---- the ground you own ---------------------------------------- */
const infraCount = id => (state.buildings && state.buildings[id]) || 0;
const standCount = () => infraCount("stand");
/* what the next one of something costs - they get dearer each time */
function infraCost(id){
  const it = INFRA_BY_ID[id];
  if(!it) return Infinity;
  return Math.round(it.base * Math.pow(it.growth, infraCount(id)));
}
const infraMaxed = id => infraCount(id) >= (INFRA_BY_ID[id]||{max:0}).max;

/* How much better your runners are today. Only ever applies on your
   own ground, and it lifts attributes rather than raw speed. */
function homeBoost(atHome){
  if(!atHome) return 1;
  return (1+HOME_BOOST) * (1 + STAND_BOOST*standCount());
}

/* how many seasons you have had a thing, for the slow earners */
function seasonsOwned(id){
  const at = (state.builtAt||{})[id];
  return at===undefined ? 0 : Math.max(0, state.season - at);
}

/* Everything the ground earns on a race week. Ticket money and pitch
   fees vary every time, so this is rolled fresh on each race day. */
function raceDayIncome(atHome){
  const tierMul = 1 + state.tier*0.55;
  const bandUp  = 1 + (INFRA_BY_ID.band.gateUp * infraCount("band"));
  const roll = r => r[0] + Math.random()*(r[1]-r[0]);
  const out = {tickets:0, food:0, shop:0, band:0, social:0, screen:0, tv:0, total:0};

  if(atHome && standCount()){
    let t=0;
    for(let i=0;i<standCount();i++) t += roll(INFRA_BY_ID.stand.ticket);
    out.tickets = Math.round(t * tierMul * bandUp);
  }
  const weekly = (id, key)=>{
    const it = INFRA_BY_ID[id], n = infraCount(id);
    if(!n || !it.weekly) return;
    let v = 0;
    for(let i=0;i<n;i++) v += roll(it.weekly);
    v *= (1 + state.tier*(it.tierScale||0));
    if(it.homeMult && atHome) v *= it.homeMult;
    if(it.grows) v *= (1 + it.grows*seasonsOwned(id));
    out[key] = Math.round(v);
  };
  weekly("foodtruck","food");
  weekly("giftshop","shop");
  weekly("band","band");
  weekly("social","social");
  weekly("bigscreen","screen");

  const cams = infraCount("camera");
  if(cams){
    let v=0;
    for(let i=0;i<cams;i++) v += roll(INFRA_BY_ID.camera.tv);
    out.tv = Math.round(v * (1 + state.tier*INFRA_BY_ID.camera.tierScale));
  }
  out.total = out.tickets+out.food+out.shop+out.band+out.social+out.screen+out.tv;
  return out;
}
/* a typical race-day take, for showing in the shop */
function expectedIncome(atHome){
  let t=0; for(let i=0;i<9;i++) t += raceDayIncome(atHome).total;
  return Math.round(t/9);
}

/* At home you are racing on the exact ground you train on, so every
   facility you own counts double. */
function playerCtx(atHome){
  return {shoeFor, facility:facilityBonuses(atHome), boost:homeBoost(atHome)};
}
const ownsPlotFor = stat => PLOTS.some(p=>p.stat===stat && plotLevel(p.id)>0);
const orderedRunners = ()=>state.order.map(id=>state.runners.find(r=>r.id===id)).filter(Boolean);
const teamAverage = ()=>{
  let t=0;
  state.runners.forEach(r=>STAT_KEYS.forEach(k=>t+=r.stats[k]));
  return t/(state.runners.length*STAT_KEYS.length);
};

/* ================================================================
   SECTION 7 : GAME ACTIONS
   ================================================================ */

/* Do the work of a session: spend the slot, improve the whole squad,
   and hand back what changed so it can be shown. */
function applyTraining(key){
  if(state.slots<=0 || !ownsPlotFor(key)) return null;
  state.slots--;
  let total=0;
  const quality = trainQuality(key);   // a bigger facility trains harder
  const rows = state.runners.map(r=>{
    const before = r.stats[key];
    const g = Math.max(0.15, 4.2*quality*(1-before/100)*(0.72+Math.random()*0.56));
    r.stats[key] = clamp(before+g,1,99);
    total += g;
    return {id:r.id, name:r.name, before, after:r.stats[key], gain:r.stats[key]-before};
  });
  const avg = total/state.runners.length;
  state.trainLog.unshift({stat:key, avg, week:state.week, season:state.season});
  state.trainLog=state.trainLog.slice(0,12);
  return {stat:key, rows, avg};
}

/* instant version - no animation (used by the headless balance tests) */
function trainStat(key){
  const res = applyTraining(key);
  if(res){ save(); render(); }
  return res;
}

/* Take the squad out onto the relevant ground and watch them work. */
function startTrainingSession(key){
  const res = applyTraining(key);
  if(!res) return;
  liveTraining = {
    stat: key,
    result: res,
    course: buildCourse(trainingVenue(key), hashStr(key)+state.week*13+state.season*7),
    phase: "running",
  };
  state.screen = "trainsession";
  save(); render();
}
function finishTrainingSession(){
  if(liveTraining) liveTraining.phase = "done";
  TrainView.stop();
  render();
}

function buyPlot(id){
  const p = PLOTS.find(x=>x.id===id);
  if(!p) return;
  const cost = plotCost(id);
  if(plotLevel(id)>=PLOT_MAX_LEVEL || state.money<cost) return;
  state.money -= cost;
  state.plots[id] = plotLevel(id)+1;
  save(); render();
}

function buyBuilding(id){
  const item = INFRA_BY_ID[id];
  if(!item || infraMaxed(id)) return;
  const cost = infraCost(id);
  if(state.money < cost) return;
  state.money -= cost;
  state.buildings = state.buildings || {};
  state.buildings[id] = infraCount(id)+1;
  state.builtAt = state.builtAt || {};
  if(state.builtAt[id]===undefined) state.builtAt[id] = state.season;
  save(); render();
}

function buyShoe(shoeId){
  const s = SHOES[shoeId];
  if(!s || state.money<s.cost) return;
  state.money-=s.cost;
  state.inventory.push({uid:uid(), shoe:shoeId, wornBy:null});
  save(); render();
}

function assignShoe(runnerId, pairUid){
  const runner = state.runners.find(r=>r.id===runnerId);
  if(!runner) return;
  const old = state.inventory.find(i=>i.uid===runner.shoeUid);
  if(old) old.wornBy=null;
  if(pairUid===null || pairUid===undefined || pairUid==="none"){
    runner.shoeUid=null;
  }else{
    const pair = state.inventory.find(i=>i.uid===+pairUid);
    if(pair){
      if(pair.wornBy){
        const other=state.runners.find(r=>r.id===pair.wornBy);
        if(other) other.shoeUid = old?old.uid:null;
        if(old) old.wornBy = other?other.id:null;
      }
      pair.wornBy=runner.id;
      runner.shoeUid=pair.uid;
    }
  }
  save(); render();
}

function setTactic(runnerId, tacticId){
  const r = state.runners.find(x=>x.id===runnerId);
  if(!r || !TACTICS[tacticId]) return;
  r.tactic = tacticId;
  save(); render();
}
function setAllTactics(tacticId){
  if(!TACTICS[tacticId]) return;
  state.runners.forEach(r=>{ r.tactic = tacticId; });
  save(); render();
}

/* Read the course and brief the squad sensibly: on heavy, churned-up
   ground the wide line is fresher and a saved kick pays; on firm ground
   the short inside line and honest front running win. */
function autoTactics(){
  const course = currentCourse();
  const mix = course.mixSummary();
  let soft=0, total=0;
  for(const k in mix){ soft += (CHURN[k]||0)*mix[k]; total += mix[k]; }
  const heavy = (soft/Math.max(1,total)) > 0.055;      // is this a slog?
  const ctx = playerCtx(course.isHome);
  const order = orderedRunners();
  order.forEach((r,i)=>{
    const eff = effectiveStats(r,ctx);
    const last = i===order.length-1;
    let t;
    if(last && eff.sprint>=55)            t = "kick";
    else if(heavy)                        t = eff.sprint>=65 ? "kick" : "wide";
    else if(eff.uneven>=65)               t = "inside";
    else if(eff.fitness>=68)              t = "front";
    else if(eff.sprint>=62)               t = "kick";
    else                                  t = "even";
    r.tactic = t;
  });
  save(); render();
}

function moveInOrder(runnerId, dir){
  const i = state.order.indexOf(runnerId);
  const j = i+dir;
  if(i<0 || j<0 || j>=state.order.length) return;
  [state.order[i],state.order[j]]=[state.order[j],state.order[i]];
  save(); render();
}

/* Auto order: heavy-ground specialists run the later legs, because
   the course cuts up as the race goes on. */
function autoOrder(){
  const course = currentCourse();
  const mix = course.mixSummary();
  const rate = r=>{
    const eff = effectiveStats(r, playerCtx());
    let heavy=0, w=0;
    for(const k in mix){
      const churn = CHURN[k]||0;
      if(churn>0){ heavy += eff[TERRAIN[k].stat]*mix[k]*churn; w += mix[k]*churn; }
    }
    return w>0 ? heavy/w : eff.speed;
  };
  state.order = state.runners.slice().sort((a,b)=>rate(a)-rate(b)).map(r=>r.id);
  save(); render();
}

/* Your home course, exactly as it will be raced this season, so the
   Ground screen shows the real thing rather than a lookalike. */
function homeCourse(){
  const venue = playerHomeVenue();
  const fx = (state.fixtures||[]).find(f=>f.home);
  const wk = fx ? fx.week : 0;
  const c = buildCourse(venue, hashStr(venue.name)+state.season*97+wk*13);
  c.isHome = true;
  c.hostName = state.club.name;
  return c;
}

/* the venue for a given fixture - your own ground when you host */
function venueForFixture(fx){
  if(!fx) return playerHomeVenue();
  if(fx.hostId===state.club.id) return playerHomeVenue();   // rebuilt live, so
  const host = clubById(fx.hostId);                          // new terrain shows up
  return (host && host.venue) || playerHomeVenue();
}

function currentCourse(){
  // buying terrain or building a stand changes your home course, so both
  // count towards the cache key or you would not see what you just bought
  const sumCounts = o => Object.keys(o||{}).reduce((a,k)=>a+(o[k]||0),0);
  const plotCount = sumCounts(state.plots);
  const buildCount = sumCounts(state.buildings);
  if(liveCourse && liveCourse._week===state.week && liveCourse._season===state.season
     && liveCourse._plots===plotCount && liveCourse._builds===buildCount) return liveCourse;
  const fx = state.fixtures[state.week];
  const venue = venueForFixture(fx);
  liveCourse = buildCourse(venue, hashStr(venue.name)+state.season*97+state.week*13);
  liveCourse.isHome = !!(fx && fx.hostId===state.club.id);
  liveCourse.hostName = fx ? (clubById(fx.hostId)||state.club).name : state.club.name;
  liveCourse._week=state.week; liveCourse._season=state.season;
  liveCourse._plots=plotCount; liveCourse._builds=buildCount;
  return liveCourse;
}

/* ---- race day ------------------------------------------------- */
function buildRace(){
  const course = currentCourse();
  const entries=[{club:state.club, order:orderedRunners(), ctx:playerCtx(course.isHome)}];
  state.rivals.forEach(c=>{
    entries.push({club:c, order:aiOrder(c, course), ctx:{}});
  });
  return newRace(course, entries);
}
function startRace(){
  liveRace = buildRace();
  state.raceState="running";
  render();
}
/* run a race with no animation at all (headless balance testing) */
function autoPlayRace(){
  liveRace = buildRace();
  simulateToEnd(liveRace);
  finishRace();
}

/* the AI uses the same heavy-ground-last logic, a bit less precisely */
function aiOrder(club, course){
  const mix=course.mixSummary();
  const rate=r=>{
    let heavy=0,w=0;
    for(const k in mix){
      const churn=CHURN[k]||0;
      if(churn>0){ heavy += r.stats[TERRAIN[k].stat]*mix[k]*churn; w+=mix[k]*churn; }
    }
    return (w>0?heavy/w:r.stats.speed) + gauss()*7;
  };
  const order = club.runners.slice().sort((a,b)=>rate(a)-rate(b));
  // rival managers brief their runners too - mostly sensibly, picking
  // tactics that suit the runner they are sending out
  order.forEach((r,i)=>{
    const roll = Math.random();
    let t = "even";
    if(r.stats.sprint > 68 && roll<0.55)                    t = "kick";
    else if(r.stats.fitness > 70 && roll<0.40)              t = "front";
    else if(r.stats.uneven > 68 && roll<0.30)               t = "inside";
    else if(roll<0.18)                                      t = "chase";
    else if(roll>0.93)                                      t = "wide";
    if(i===SQUAD_SIZE-1 && r.stats.sprint>60 && roll<0.7)   t = "kick";  // anchor leg
    r.tactic = t;
  });
  return order;
}

function finishRace(){
  const R = liveRace;
  const st = standings(R);
  const me = R.teams.find(t=>t.isPlayer);
  const place = st.findIndex(t=>t.isPlayer)+1;
  const tierMul = TIERS[state.tier].prize;
  const prize = Math.round(RACE_PRIZE[place-1]*tierMul);
  const atHome = !!R.course.isHome;
  const income = raceDayIncome(atHome);             // rolled fresh every race
  state.money += prize + income.total;

  st.forEach((tm,i)=>{
    const rec = state.table[tm.club.id];
    if(!rec) return;
    rec.pts += POINTS[i]||0;
    rec.played++;
    rec.totalPos += (i+1);
    if(i===0) rec.wins++;
    if(i+1 < rec.best) rec.best=i+1;
  });

  const a = analyseTeam(me);
  state.lastResult = {
    venue: R.course.venue,
    lengthM: R.course.lengthM,
    week: state.week, season: state.season, tier: state.tier,
    place, prize, atHome, income,
    stands: standCount(),
    boostPct: atHome ? Math.round((homeBoost(true)-1)*100) : 0,
    points: POINTS[place-1]||0,
    winTime: st[0].finishTime,
    myTime: me.finishTime,
    positions: st.map((tm,i)=>({
      place:i+1, name:tm.club.name, code:tm.code, colour:tm.colour,
      isPlayer:tm.isPlayer, time:tm.finishTime, gap:tm.finishTime-st[0].finishTime,
    })),
    lost: a.lost,
    sprintGain: a.sprintGain,
    emptyLegs: a.emptyLegs,
    avgStamina: a.avgStamina,
    worst: Object.keys(a.worstBy).reduce((o,k)=>{
      o[k]={name:a.worstBy[k].runner.name, secs:a.worstBy[k].secs}; return o;
    },{}),
    legs: me.runners.map((r,i)=>({
      leg:i+1, name:r.name, time:r.legTime, staminaEnd:r.staminaEnd,
      tactic:r.tactic.name, tacticShort:r.tactic.short, exec:r.exec,
      boxedFor:r.boxedFor,
      lost:Object.keys(r.lost).reduce((o,k)=>{o[k]=r.lost[k];return o;},{}),
      sprintGain:r.sprintGain,
    })),
  };
  const fx = state.fixtures[state.week];
  if(fx) fx.result = {place, points:state.lastResult.points, prize, income:prize+income.total};

  state.raceState="done";
  save(); render();
}

function continueAfterRace(){
  state.week++;
  state.raceState=null;
  liveCourse=null; liveRace=null;
  if(state.week>=WEEKS_PER_SEASON){
    endSeason();
  }else{
    state.slots = TRAINING_SLOTS;
    state.screen="training";
  }
  save(); render();
}

function endSeason(){
  const table = sortedTable();
  const pos = table.findIndex(r=>r.club.id===state.club.id)+1;
  const prize = Math.round(LEAGUE_PRIZE[pos-1]*TIERS[state.tier].prize);
  state.money += prize;

  const promoted  = pos===1 && state.tier<TIERS.length-1;
  const relegated = pos===TEAMS_PER_LEAGUE && state.tier>0;
  const champion  = pos===1;

  state.seasonEnd = {
    season:state.season, tier:state.tier, pos, prize, promoted, relegated, champion,
    table: table.map((r,i)=>({place:i+1, name:r.club.name, code:r.club.code,
      colour:r.club.colour, pts:r.pts, wins:r.wins, isPlayer:r.club.id===state.club.id})),
    newTier: promoted?state.tier+1:(relegated?state.tier-1:state.tier),
  };
  state.screen="season";
}

function startNextSeason(){
  const se = state.seasonEnd;
  const changed = se.newTier !== state.tier;
  state.tier = se.newTier;
  state.season++;
  state.week=0;
  state.slots=TRAINING_SLOTS;
  state.runners.forEach(r=>r.age++);

  if(changed){
    state.rivals = makeRivals(state.tier, TEAMS_PER_LEAGUE-1, [state.club.name]);
  }else{
    // clubs you know get better every year, and the higher the league
    // the harder they work at it
    const g = RIVAL_GROWTH[clamp(state.tier,0,RIVAL_GROWTH.length-1)];
    state.rivals.forEach(c=>c.runners.forEach(r=>{
      STAT_KEYS.forEach(k=>{ r.stats[k]=clamp(r.stats[k]+g*(1-r.stats[k]/100),1,99); });
    }));
  }
  resetTable();
  buildFixtures();
  state.seasonEnd=null;
  state.lastResult=null;
  state.screen="squad";
  save(); render();
}

/* ---- what should the manager do next? ------------------------- */
function recommendations(res){
  const out=[];
  const entries = STAT_KEYS.map(k=>({k, secs:res.lost[k]||0}))
                           .filter(e=>e.secs>0.4)
                           .sort((a,b)=>b.secs-a.secs);
  entries.slice(0,3).forEach(e=>{
    const s = STAT_BY_KEY[e.k];
    const owns = ownsPlotFor(e.k);
    const worst = res.worst[e.k];
    if(owns){
      out.push(`Your squad lost ${e.secs.toFixed(0)}s to ${s.name.toUpperCase()}. Train it${worst?` — worst was ${worst.name} (${worst.secs.toFixed(0)}s)`:""}.`);
    }else{
      const plot = PLOT_BY_STAT[e.k];
      out.push(`Your squad lost ${e.secs.toFixed(0)}s to ${s.name.toUpperCase()} and you cannot train it. Buy the ${plot?plot.name.toUpperCase():"facility"} (${plot?money(plot.cost):""}).`);
    }
  });
  if(res.emptyLegs>=3)
    out.push(`${res.emptyLegs} runners finished their leg completely empty. That is a fitness problem.`);
  if(res.sprintGain>2)
    out.push(`Your kick into the handovers gained you ${res.sprintGain.toFixed(0)}s. Sprint training is paying off.`);
  if(!out.length) out.push("Nothing is badly wrong. Keep training your weakest attribute.");
  return out;
}

/* ================================================================
   SECTION 8 : SAVE / LOAD
   ================================================================ */
function save(){
  try{
    state.uidSeed=_uid;
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
  }catch(e){ /* private browsing, ignore */ }
}
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const s = JSON.parse(raw);
    if(!s || !s.runners || !s.v || s.v>SAVE_VERSION) return false;
    state = s;
    _uid = s.uidSeed || 10000;
    if(s.v < SAVE_VERSION) migrateSave();
    state.raceState = state.raceState==="running" ? null : state.raceState;
    // a session being watched is not saved, so come back to the training screen
    if(state.screen==="trainsession") state.screen="training";
    liveRace=null; liveCourse=null; liveTraining=null;
    return true;
  }catch(e){ return false; }
}
/* v1 saves predate home grounds: give every club one and rebuild the
   fixture list, keeping results already raced this season. */
function migrateSave(){
  if(state.v < 2){
    // v1 predates home grounds: give every club one, rebuild the fixtures
    state.rivals.forEach(c=>{ if(!c.venue) c.venue = makeVenueFor(c.name, state.tier); });
    const old = state.fixtures || [];
    buildFixtures();
    state.fixtures.forEach((f,i)=>{ if(old[i] && old[i].result) f.result = old[i].result; });
  }
  if(state.v < 3){
    // v2 predates stands, the gift shop and race tactics
    state.buildings = state.buildings || [];
    state.runners.forEach(r=>{ if(!r.tactic) r.tactic = DEFAULT_TACTIC; });
  }
  if(state.v < 4){
    // v3 kept plots and buildings as one-off lists; they stack now, so
    // turn each list into counts and map the old stand tiers onto stands
    if(Array.isArray(state.plots)){
      const owned = state.plots;
      state.plots = PLOTS.reduce((o,p)=>{ o[p.id] = owned.includes(p.id)?1:0; return o; },{});
    }
    if(Array.isArray(state.buildings)){
      const old = state.buildings;
      const b = {};
      // clubhouse/grandstand/main stadium all become plain stands
      const stands = (old.includes("clubhouse")?1:0)+(old.includes("grandstand")?2:0)
                   + (old.includes("mainstand")?3:0);
      if(stands) b.stand = stands;
      if(old.includes("giftshop")) b.giftshop = 1;
      state.buildings = b;
    }
    state.buildings = state.buildings || {};
    state.builtAt = state.builtAt || {};
    Object.keys(state.buildings).forEach(id=>{
      if(state.builtAt[id]===undefined) state.builtAt[id] = state.season;
    });
  }
  state.v = SAVE_VERSION;
  save();
}

function wipeSave(){
  if(!confirm("Delete your save and start a brand new club?")) return;
  localStorage.removeItem(SAVE_KEY);
  location.reload();
}

function pips(v){
  const n = clamp(Math.round(v/10),0,10);
  const cls = v>=70?"on":(v>=45?"mid":"low");
  let h='<span class="pips">';
  for(let i=0;i<10;i++) h+=`<i class="pip${i<n?" "+cls:""}"></i>`;
  return h+"</span>";
}
function statCell(v){
  return `<span title="${v.toFixed(1)}">${pips(v)}</span> <span class="statval">${Math.round(v)}</span>`;
}

/* ---- where am I in the season, and what happens if it ends now? --- */
function seasonStatus(){
  // on the results screen the week has not ticked over yet, so take
  // whichever count is further on - they agree in normal play
  const raced = Math.max(state.week, state.fixtures.filter(f=>f.result).length);
  return {raced, left: Math.max(0, WEEKS_PER_SEASON - raced), pos: myTablePos()};
}
function outlook(){
  const pos = myTablePos();
  const top = state.tier >= TIERS.length-1;
  if(pos===1) return top
    ? {cls:"up",   text:"1st &mdash; champions of the sport"}
    : {cls:"up",   text:`1st &mdash; promoted to the ${TIERS[state.tier+1].short} league if it ends now`};
  if(pos===TEAMS_PER_LEAGUE && state.tier>0)
    return {cls:"down", text:`Last &mdash; relegated to the ${TIERS[state.tier-1].short} league if it ends now`};
  const lead = sortedTable()[0];
  const me   = sortedTable().find(r=>r.club.id===state.club.id);
  const gap  = lead.pts - me.pts;
  return {cls:"mid", text:`${ordinal(pos)} &mdash; ${gap} point${gap===1?"":"s"} off top spot, and only 1st goes up`};
}

function renderSeasonBar(){
  const el = document.getElementById("seasonbar");

                .filter(Boolean).join(" ");

                 : `<b>Season over</b>`
      }</span>

    </div>`;
}

/* ---- SQUAD ---------------------------------------------------- */

      </div>
    </div>
    <p class="muted small">Leg 1 runs first, leg 10 brings the baton home. The ground cuts up as the
      race goes on, so mud, grass and rough sections get heavier on the later legs &mdash;
      put your heavy-ground runners at the back. Numbers shown include shoes and facilities.</p>
    <div style="overflow-x:auto">
    <table>
      <tr><th>Leg</th><th></th><th>Runner</th><th>Shoes</th>
        ${STATS.map(s=>`<th title="${esc(s.desc)}">${s.short}</th>`).join("")}</tr>
      ${rows}
    </table>
    </div>
  </div>
  <div class="panel">
    <h3>Facility bonuses in use</h3>
    <div class="row small">
      ${STAT_KEYS.filter(k=>fac[k]).map(k=>`<span class="tag good">${STAT_BY_KEY[k].name} +${fac[k]}</span>`).join(" ")
        || '<span class="muted">None yet &mdash; buy terrain in the shop.</span>'}
    </div>
  </div>`;
}

/* ---- TRAINING -------------------------------------------------- */
function screenTraining(){
  const cards = STATS.map(s=>{
    const owns = ownsPlotFor(s.key);
    const plot = PLOT_BY_STAT[s.key];
    const avg = state.runners.reduce((a,r)=>a+r.stats[s.key],0)/state.runners.length;
    const can = owns && state.slots>0;
    return `<div class="card ${owns?"":"locked"}">
      <div class="row spread">
        <span class="title">${s.name}</span>
        <span class="muted small">avg ${avg.toFixed(1)}</span>
      </div>
      <div>${pips(avg)}</div>
      <div class="muted small">${esc(s.desc)}</div>
      ${owns
        ? `<button class="primary" data-act="train" data-arg="${s.key}" ${can?"":"disabled"}>Train Whole Team</button>`
        : `<div class="tag bad">Locked</div><div class="small muted">Needs the ${esc(plot?plot.name:"facility")} &mdash; ${plot?money(plot.cost):""} in the shop.</div>`}
    </div>`;
  }).join("");

  const log = state.trainLog.length
    ? state.trainLog.map(l=>`<div class="small">S${l.season} W${l.week+1} &middot; ${STAT_BY_KEY[l.stat].name}
        <span class="up">+${l.avg.toFixed(1)} avg</span></div>`).join("")
    : '<div class="muted small">No sessions yet.</div>';

  return `
  <div class="panel">
    <div class="row spread">
      <h2>Training Ground</h2>
      <span class="chip">Sessions left this week <b>${state.slots}</b></span>
    </div>
    <p class="muted small">Each session trains the <b>whole squad</b> in one attribute. Gains get
      smaller as an attribute approaches 100. You can only train an attribute you own the terrain for.</p>
    <div class="grid cols3">${cards}</div>
  </div>
  <div class="panel">
    <h3>Recent sessions</h3>
    ${log}
  </div>`;
}

  <div class="panel">
    <div class="row spread">

      <div class="row">

      </div>
    </div>
    <div id="raceWrap"><canvas id="groundcanvas"></canvas></div>
    <div class="row spread" style="margin-top:10px">

        ${terr.map(p=>`<tr>
          <td>${esc(p.name)}</td>
          <td class="num">${plotLevel(p.id)}/${PLOT_MAX_LEVEL}</td>
          <td class="num up">+${facilityBonusFor(plotLevel(p.id))} ${STAT_BY_KEY[p.stat].short}</td>

          <td class="num">${infraCount(it.id)}/${it.max}</td>

/* ---- TRAINING SESSION ------------------------------------------ */
function screenTrainSession(){
  const T = liveTraining;
  if(!T) return screenTraining();
  const s = STAT_BY_KEY[T.stat];

  if(T.phase==="running"){
    return `
    <div class="panel">
      <div class="row spread">
        <h2>${esc(s.name)} Session</h2>
        <div class="row">
          <span class="chip">Sessions left <b>${state.slots}</b></span>
          <button data-act="skiptrain">Skip</button>
        </div>
      </div>
      <div id="raceWrap"><canvas id="traincanvas" data-act="skipintro"></canvas></div>
      <p class="muted small" style="margin-top:8px">The whole squad is out on the
        ${esc(TRAIN_GROUND[T.stat]?TRAIN_GROUND[T.stat].label.toLowerCase():"training ground")},
        working on ${esc(s.name.toLowerCase())}. ${esc(s.desc)}.</p>
    </div>`;
  }

  const rows = T.result.rows.slice().sort((a,b)=>b.gain-a.gain).map(r=>`
    <tr>
      <td>${esc(r.name)}</td>
      <td class="num muted">${r.before.toFixed(1)}</td>
      <td class="num">&rarr;</td>
      <td class="num"><b>${r.after.toFixed(1)}</b></td>
      <td class="num up">+${r.gain.toFixed(1)}</td>
      <td>${pips(r.after)}</td>
    </tr>`).join("");
  const before = T.result.rows.reduce((a,r)=>a+r.before,0)/T.result.rows.length;
  const after  = T.result.rows.reduce((a,r)=>a+r.after,0)/T.result.rows.length;

  return `
  <div class="banner good">${esc(s.name)} session done &mdash; squad ${before.toFixed(1)}
    &rarr; ${after.toFixed(1)} (+${T.result.avg.toFixed(1)} average).</div>
  <div class="panel">
    <h2>What the session did</h2>
    <table>
      <tr><th>Runner</th><th>Before</th><th></th><th>After</th><th>Gain</th><th>${esc(s.name)}</th></tr>
      ${rows}
    </table>
    <p class="muted small" style="margin-top:8px">Gains get smaller the closer an attribute is to 100,
      so your weakest runners improve fastest.</p>
  </div>
  <div class="panel center">
    ${state.slots>0
      ? `<p>You have <b>${state.slots}</b> session${state.slots===1?"":"s"} left this week.</p>`
      : `<p class="muted">No sessions left this week.</p>`}
    <button class="primary" data-act="nav" data-arg="training">Back to Training</button>
    ${state.slots===0?`<button data-act="nav" data-arg="race">On to Race Day &raquo;</button>`:""}
  </div>`;
}

/* ---- SHOP ------------------------------------------------------ */
function screenShop(){
  const plots = PLOTS.map(p=>{
    const lvl = plotLevel(p.id);
    const cost = plotCost(p.id);
    const maxed = lvl>=PLOT_MAX_LEVEL;
    const afford = state.money>=cost;
    const terr = PLOT_TERRAIN[p.stat];
    return `<div class="card ${lvl?"owned":""}">
      <div class="row spread">
        <span class="title">${p.name}</span>
        <span class="price">${maxed?"MAXED":money(cost)}</span>
      </div>
      <div class="muted small">${esc(p.desc)}</div>
      <div>
        <span class="tag ${lvl?"good":""}">${lvl?"Unlocked":"Unlocks"} ${STAT_BY_KEY[p.stat].name} training</span>
        <span class="tag good">+${facilityBonusFor(lvl+1).toFixed(1).replace(/\.0$/,"")} ${STAT_BY_KEY[p.stat].short} at ${lvl+1} owned</span>
        <span class="tag good">+${Math.round(TRAIN_QUALITY*100)}% training per extra</span>
        ${terr?`<span class="tag">more ${TERRAIN[terr].name.toLowerCase()} at home</span>`:""}
      </div>
      <div class="row spread">
        <span class="muted small">Owned: <b>${lvl}</b>/${PLOT_MAX_LEVEL}
          ${lvl?`&middot; <span class="up">+${facilityBonusFor(lvl)} ${STAT_BY_KEY[p.stat].short}, sessions x${trainQuality(p.stat).toFixed(2)}</span>`:""}</span>
        ${maxed?"":`<button data-act="buyplot" data-arg="${p.id}" ${afford?"":"disabled"}>
          ${lvl?"Buy another":"Buy"}</button>`}
      </div>
    </div>`;
  }).join("");

  const shoes = SHOE_LIST.filter(s=>s.cost>0).map(s=>{
    const own = state.inventory.filter(i=>i.shoe===s.id).length;
    const afford = state.money>=s.cost;
    const mods = Object.keys(s.mods).map(k=>
      `<span class="tag ${s.mods[k]>0?"good":"bad"}">${STAT_BY_KEY[k].short} ${s.mods[k]>0?"+":""}${s.mods[k]}</span>`).join(" ");
    return `<div class="card">
      <div class="row spread">
        <span class="title">${s.name}</span>
        <span class="price">${money(s.cost)}</span>
      </div>
      <div>${mods}</div>
      <div class="row spread">
        <span class="muted small">Owned: ${own}</span>
        <button data-act="buyshoe" data-arg="${s.id}" ${afford?"":"disabled"}>Buy Pair</button>
      </div>
    </div>`;
  }).join("");

  const spare = state.inventory.filter(i=>!i.wornBy);
  const tierMul = 1 + state.tier*0.55;
  const grounds = INFRA.map(it=>{
    const n = infraCount(it.id);
    const cost = infraCost(it.id);
    const maxed = infraMaxed(it.id);
    const afford = state.money>=cost;
    const tags = [];
    if(it.boost) tags.push(`<span class="tag good">+${Math.round(it.boost*100)}% at home each</span>`);
    if(it.ticket) tags.push(`<span class="tag good">${money(Math.round(it.ticket[0]*tierMul))}&ndash;${money(Math.round(it.ticket[1]*tierMul))} tickets per home race, each</span>`);
    if(it.weekly){
      const lo=Math.round(it.weekly[0]*(1+state.tier*(it.tierScale||0)));
      const hi=Math.round(it.weekly[1]*(1+state.tier*(it.tierScale||0)));
      tags.push(`<span class="tag good">${money(lo)}&ndash;${money(hi)} every race week, each</span>`);
      if(it.homeMult) tags.push(`<span class="tag good">x${it.homeMult} at home</span>`);
      if(it.grows) tags.push(`<span class="tag">+${Math.round(it.grows*100)}% per season owned</span>`);
    }
    if(it.tv){
      const lo=Math.round(it.tv[0]*(1+state.tier*it.tierScale));
      const hi=Math.round(it.tv[1]*(1+state.tier*it.tierScale));
      tags.push(`<span class="tag good">${money(lo)}&ndash;${money(hi)} per race in this league, each</span>`);
      tags.push(`<span class="tag">pays far more the higher you climb</span>`);
    }
    if(it.gateUp) tags.push(`<span class="tag good">+${Math.round(it.gateUp*100)}% ticket sales each</span>`);
    return `<div class="card ${n?"owned":""}">
      <div class="row spread">
        <span class="title">${it.name}</span>
        <span class="price">${maxed?"MAXED":money(cost)}</span>
      </div>
      <div class="muted small">${esc(it.desc)}</div>
      <div>${tags.join(" ")}</div>
      <div class="row spread">
        <span class="muted small">Built: <b>${n}</b>/${it.max}</span>
        ${maxed?"":`<button data-act="buybuilding" data-arg="${it.id}" ${afford?"":"disabled"}>
          ${n?"Build another":"Build"}</button>`}
      </div>
    </div>`;
  }).join("");

  return `
  <div class="panel">
    <div class="row spread">
      <h2>Your Ground</h2>
      <div class="row">
        <span class="chip">Home boost <b>+${Math.round((homeBoost(true)-1)*100)}%</b></span>
        <span class="chip">Stands <b>${standCount()}</b></span>
        <span class="chip money">Cash <b>${money(state.money)}</b></span>
      </div>
    </div>
    <p class="muted small">Build it as big as you like &mdash; everything here can be bought again and
      again, and each one costs more than the last. Every stand adds
      <b>+${Math.round(STAND_BOOST*100)}%</b> to your runners at home, on top of the
      <b>+${Math.round(HOME_BOOST*100)}%</b> you get for being on your own ground. Ticket money and
      pitch fees vary every race day.</p>
    <div class="row" style="margin-bottom:8px">
      <span class="chip">Typical home race day <b class="up">${money(expectedIncome(true))}</b></span>
      <span class="chip">Typical away race day <b class="up">${money(expectedIncome(false))}</b></span>
    </div>
    <div class="grid cols3">${grounds}</div>
  </div>
  <div class="panel">
    <div class="row spread"><h2>Terrain &amp; Facilities</h2><span class="chip money">Cash <b>${money(state.money)}</b></span></div>
    <p class="muted small">Buying a piece of terrain lets your squad train on it. Train it and they get
      faster on that ground in races &mdash; and owning it gives a small permanent bonus straight away.</p>
    <div class="grid cols3">${plots}</div>
  </div>
  <div class="panel">
    <h2>Shoes</h2>
    <p class="muted small">Every pair you buy goes into the kit bag. Assign pairs to runners on the Squad screen.
      ${spare.length?`<b>${spare.length}</b> spare pair(s) unassigned.`:""}</p>
    <div class="grid cols3">${shoes}</div>
  </div>`;
}

/* ---- LEAGUE ---------------------------------------------------- */

  const rows = sortedTable().map((r,i)=>`
    <tr class="${r.club.id===state.club.id?"me":""}">
      <td class="num">${i+1}</td>
      <td><span class="swatch" style="background:${r.club.colour}"></span> ${esc(r.club.name)}</td>
      <td>${r.club.code}</td>
      <td class="num">${r.played}</td>
      <td class="num">${r.wins}</td>
      <td class="num">${r.best===99?"-":ordinal(r.best)}</td>
      <td class="num"><b>${r.pts}</b></td>
    </tr>`).join("");

  const fixtures = state.fixtures.map(f=>{
    const done = !!f.result;
    const isNow = f.week===state.week && !done;
    const host = clubById(f.hostId);
    return `<tr class="${isNow?"me":""}">
      <td class="num">${f.week+1}</td>
      <td>${esc(f.venue)}
        ${f.home?'<span class="tag good">Home</span>':`<span class="tag">at ${esc(host?host.code:"?")}</span>`}</td>
      <td>${done?ordinal(f.result.place):(isNow?'<span class="blink">NEXT UP</span>':"&mdash;")}</td>
      <td class="num">${done?f.result.points:""}</td>
      <td class="num">${done?money(f.result.income!==undefined?f.result.income:f.result.prize):""}</td>

  return `
  <div class="panel">
    <div class="row spread">
      <h2>${esc(t.name)}</h2>
      <span class="chip">Season <b>${state.season}</b></span>
    </div>
    <div class="banner ${outlook().cls==="up"?"good":(outlook().cls==="down"?"bad":"")}">
      ${outlook().text}.
      ${seasonStatus().left>0
        ? `${seasonStatus().left} race${seasonStatus().left===1?"":"s"} still to run.`
        : `The season is over.`}
    </div>
    <p class="muted small">Points: ${POINTS.join(" / ")} by finishing position.
      Win the league and you are promoted next season with a bonus of ${money(LEAGUE_PRIZE[0]*t.prize)}.
      ${state.tier>0?"Finish last and you go down.":""}</p>
    <table>
      <tr><th>Pos</th><th>Club</th><th></th><th>Raced</th><th>Wins</th><th>Best</th><th>Pts</th></tr>
      ${rows}
    </table>
  </div>
  <div class="panel">
    <h3>Fixtures</h3>
    <table>
      <tr><th>Wk</th><th>Course</th><th>Result</th><th>Pts</th><th>Prize</th></tr>
      ${fixtures}
    </table>
  </div>
  <div class="panel">
    <h3>The Ladder</h3>
    <table>
      <tr><th>Tier</th><th>League</th><th>Rival Standard</th><th>Prize Money</th></tr>
      ${TIERS.map((x,i)=>`<tr class="${i===state.tier?"me":""}">
        <td class="num">${i+1}</td><td>${esc(x.name)}</td>
        <td>${x.base} avg</td><td>${"£".repeat(Math.min(5,Math.round(x.prize)))||"£"}</td></tr>`).join("")}
    </table>
  </div>`;
}

/* ---- RACE DAY -------------------------------------------------- */
function screenRacePreview(){
  const course = currentCourse();
  const mix = course.mixSummary();
  const ctx = playerCtx(course.isHome);
  const order = orderedRunners().map((r,i)=>{
    const eff=effectiveStats(r,ctx);
    let fit=0,w=0;
    for(const k in mix){ fit+=eff[TERRAIN[k].stat]*mix[k]; w+=mix[k]; }
    const suit = fit/w;
    const tac = tacticOf(r);
    // how well suited they are to what you have asked of them
    const skill = eff[tac.stat];
    const conf = skill>=70?["good","Confident"]:(skill>=48?["","Should manage"]:["bad","Risky"]);
    return `<tr><td class="num">${i+1}</td><td>${esc(r.name)}</td>
      <td>${statCell(suit)}</td>
      <td><select data-act="tactic" data-arg="${r.id}">
        ${TACTIC_LIST.map(t=>`<option value="${t.id}" ${t.id===tac.id?"selected":""}>${esc(t.name)}</option>`).join("")}
      </select></td>
      <td><span class="tag ${conf[0]}">${conf[1]}</span>
        <span class="muted small">${STAT_BY_KEY[tac.stat].short} ${Math.round(skill)}</span></td>
      <td class="muted small">${esc((state.inventory.find(p=>p.uid===r.shoeUid)||{shoe:"none"}).shoe==="none"?"barefoot":SHOES[(state.inventory.find(p=>p.uid===r.shoeUid)||{shoe:"trainers"}).shoe].name)}</td></tr>`;
  }).join("");

  const homeNote = course.isHome
    ? `<div class="banner good">Home fixture &mdash; every piece of terrain you have bought is built
        into this course, your facility bonuses count double, and your squad runs
        <b>+${Math.round((homeBoost(true)-1)*100)}% stronger</b> today${
          standCount()?` with a crowd in ${standCount()} stand${standCount()===1?"":"s"} behind them`:""}.
        ${standCount()?`Ticket money is yours today &mdash; a typical home race day takes
            <b>${money(expectedIncome(true))}</b>.`
          :`Build a stand on the Shop screen to take money on the gate.`}</div>`
    : `<div class="banner">Away at ${esc(course.hostName)}. Their ground, their kind of course.</div>`;

  return `
  ${homeNote}
  <div class="panel">
    <div class="row spread">
      <h2>Race Day &mdash; ${esc(course.venue)}</h2>
      <div class="row">
        <span class="chip">${course.isHome?"<b>HOME</b>":"Away"}</span>
        <span class="chip">Race <b>${state.week+1} of ${WEEKS_PER_SEASON}</b></span>
        ${state.week+1===WEEKS_PER_SEASON
          ? '<span class="chip"><b class="blink">FINAL RACE OF THE SEASON</b></span>' : ""}
      </div>
    </div>
    <div id="raceWrap"><canvas id="preview"></canvas></div>
    <div class="row spread" style="margin-top:10px">
      <div class="terrainkey">
        ${TERRAIN_KEYS.filter(k=>mix[k]).map(k=>
          `<span><i class="swatch" style="background:${TERRAIN[k].col}"></i>${TERRAIN[k].name} ${Math.round(mix[k]/16*100)}%</span>`).join("")}
        ${course.exposedCount()?`<span><i class="swatch" style="background:#8fa8c9"></i>Wind ${Math.round(course.exposedCount()/16*100)}%</span>`:""}
      </div>
      <div class="row">
        <button data-act="auto">Auto Order</button>
        <button data-act="autotactics">Suggest Tactics</button>
        <button class="primary" data-act="startrace">Start Relay</button>
      </div>
    </div>
  </div>
  <div class="panel">
    <div class="row spread">
      <h3>Race briefing</h3>
      <div class="row">
        <span class="muted small">Set every runner to</span>
        <select data-act="tacticall">
          <option value="">&mdash; choose &mdash;</option>
          ${TACTIC_LIST.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}
        </select>
      </div>
    </div>
    <p class="muted small">Tell each runner how to race their leg. They will try &mdash; but a hard
      tactic asks a lot, and a runner who is not built for it can get it wrong, pay the price and
      get nothing back. The inside line is the shortest way round, so it is quicker, but that is
      where the traffic is and you will get boxed in.</p>
    <table><tr><th>Leg</th><th>Runner</th><th>Course suitability</th><th>Tactic</th><th>Can they do it?</th><th>Shoes</th></tr>${order}</table>
    <div class="grid cols3" style="margin-top:10px">
      ${TACTIC_LIST.map(t=>`<div class="panel2" style="margin:0">
        <div class="title" style="color:var(--gold);text-transform:uppercase;font-size:11px;letter-spacing:1px">${esc(t.name)}</div>
        <div class="small muted">${esc(t.desc)}</div>
        <div class="small"><span class="tag">Needs ${STAT_BY_KEY[t.stat].name}</span>
          <span class="tag ${t.risk>=0.24?"bad":(t.risk<=0.08?"good":"")}">${
            t.risk>=0.24?"High risk":(t.risk<=0.08?"Low risk":"Some risk")}</span></div>
      </div>`).join("")}
    </div>
  </div>`;
}

function screenRaceRunning(){
  return `
  <div class="panel">
    <div class="row spread">
      <h2>${esc(currentCourse().venue)}</h2>
      <div class="row">
        <button data-act="speed" data-arg="18">Slow</button>
        <button data-act="speed" data-arg="34" class="on" id="spd34">Normal</button>
        <button data-act="speed" data-arg="90">Fast</button>
        <button data-act="skip">Skip to Result</button>
      </div>
    </div>
    <div id="raceWrap"><canvas id="racecanvas"></canvas></div>
  </div>`;
}

function lossBars(res){
  // sprint is shown as a gain on its own row, not as a loss
  const entries = STAT_KEYS.filter(k=>k!=="sprint").map(k=>({k, secs:res.lost[k]||0}));
  const maxv = Math.max(1, ...entries.map(e=>e.secs), res.sprintGain);
  let h = entries.sort((a,b)=>b.secs-a.secs).map(e=>`
    <div class="lossrow">
      <span class="lossname">${STAT_BY_KEY[e.k].name}</span>
      <span class="lossbar"><i style="width:${Math.round(e.secs/maxv*100)}%"></i></span>
      <span class="lossnum">-${e.secs.toFixed(1)}s</span>
    </div>`).join("");
  h += `<div class="lossrow">
      <span class="lossname" style="color:var(--green)">Sprint</span>
      <span class="lossbar"><i class="gain" style="width:${Math.round(res.sprintGain/maxv*100)}%"></i></span>
      <span class="lossnum up">+${res.sprintGain.toFixed(1)}s</span>
    </div>`;
  return h;
}

function screenResults(){
  const res=state.lastResult;
  if(!res) return `<div class="panel">No result yet.</div>`;
  const pos = res.positions.map(p=>`
    <tr class="${p.isPlayer?"me":""}">
      <td class="num">${p.place}</td>
      <td><span class="swatch" style="background:${p.colour}"></span> ${esc(p.name)}</td>
      <td class="num">${fmtTime(p.time)}</td>
      <td class="num muted">${p.gap>0.05?"+"+p.gap.toFixed(1):""}</td>
      <td class="num">${POINTS[p.place-1]||0}</td>
    </tr>`).join("");

  const legs = res.legs.map(l=>{
    // speed is a flat baseline every runner pays, so the per-leg tag calls
    // out the situational weakness - the ground or the fade
    const worst = STAT_KEYS.filter(k=>k!=="speed"&&k!=="sprint")
      .map(k=>({k,v:l.lost[k]||0})).sort((a,b)=>b.v-a.v)[0];
    const st=l.staminaEnd;
    return `<tr>
      <td class="num">${l.leg}</td>
      <td>${esc(l.name)}</td>
      <td class="num">${fmtTime(l.time)}</td>
      <td><span class="lossbar" style="display:inline-block;width:70px;vertical-align:middle">
          <i style="width:${Math.round(st)}%;background:${st>50?"var(--green)":st>22?"var(--gold)":"var(--red)"}"></i>
        </span> <span class="statval">${Math.round(st)}</span></td>
      <td>${worst&&worst.v>0.3?`<span class="tag bad">${STAT_BY_KEY[worst.k].name} -${worst.v.toFixed(1)}s</span>`:'<span class="tag good">solid</span>'}</td>
      <td>
        <span class="tag ${l.exec==="good"?"good":(l.exec==="bad"?"bad":"")}">${esc(l.tacticShort||"EVEN")}</span>
        <span class="small ${l.exec==="good"?"up":(l.exec==="bad"?"down":"muted")}">${
          l.exec==="good"?"nailed it":(l.exec==="bad"?"went wrong":"scrappy")}</span>
        ${l.boxedFor>12?`<span class="tag bad">boxed ${Math.round(l.boxedFor)}s</span>`:""}
      </td>
    </tr>`;
  }).join("");

  const banner = res.place===1
    ? `<div class="banner good">Race won at ${esc(res.venue)}! ${money(res.prize)} prize money.</div>`
    : res.place<=3
      ? `<div class="banner">${ordinal(res.place)} at ${esc(res.venue)} &mdash; ${money(res.prize)}.</div>`
      : `<div class="banner bad">${ordinal(res.place)} at ${esc(res.venue)} &mdash; ${money(res.prize)}. Work to do.</div>`;

  return `
  ${banner}
  <div class="grid cols2">
    <div class="panel">
      <h2>Result</h2>
      <table><tr><th>Pos</th><th>Club</th><th>Time</th><th>Gap</th><th>Pts</th></tr>${pos}</table>
      <p class="small muted">Winning time ${fmtTime(res.winTime)} over ${SQUAD_SIZE} legs
        of ${res.lengthM}m.</p>
      <h3 style="margin-top:10px">Takings</h3>
      <table>
        <tr><td>Prize money (${ordinal(res.place)})</td><td class="num">${money(res.prize)}</td></tr>
        ${(()=>{
          const inc = res.income || {};
          const lines = [
            ["tickets", `Ticket sales &mdash; ${res.stands||0} stand${res.stands===1?"":"s"}`],
            ["tv",      "TV rights"],
            ["social",  "Social media"],
            ["shop",    "Gift shop"],
            ["food",    "Food truck pitches"],
            ["screen",  "Big screen advertising"],
            ["band",    "Live band"],
          ];
          return lines.filter(l=>inc[l[0]]).map(l=>
            `<tr><td>${l[1]}${res.atHome&&(l[0]==="tickets"||l[0]==="food"||l[0]==="shop")?" (home)":""}</td>
             <td class="num up">${money(inc[l[0]])}</td></tr>`).join("");
        })()}
        <tr><th>Total</th><th class="num">${money(res.prize+((res.income&&res.income.total)||0))}</th></tr>
      </table>
      ${res.atHome&&res.boostPct?`<p class="small up">Home advantage on the day: +${res.boostPct}% on your runners' attributes.</p>`:""}
    </div>
    <div class="panel">
      <h2>Where you lost time</h2>
      <p class="muted small">Seconds your ten runners gave away to each attribute across the whole relay.</p>
      ${lossBars(res)}
      <h3 style="margin-top:10px">What to do next</h3>
      ${recommendations(res).map(r=>`<div class="small" style="margin-bottom:4px">&gt; ${esc(r)}</div>`).join("")}
    </div>
  </div>
  <div class="panel">
    <h2>Leg by leg</h2>
    <table><tr><th>Leg</th><th>Runner</th><th>Time</th><th>Stamina left</th>
      <th>Biggest ground/fade loss</th><th>Tactic</th></tr>${legs}</table>
  </div>
  <div class="panel center">
    ${(()=>{
      const s = seasonStatus(), o = outlook();
      if(s.left<=0) return `
        <p><b class="up">That was the last race of season ${state.season}.</b></p>
        <p class="small ${o.cls==="up"?"up":""}">${o.text}</p>
        <button class="primary" data-act="continue">See how the season finished &raquo;</button>`;
      return `
        <p>Race <b>${s.raced}</b> of <b>${WEEKS_PER_SEASON}</b> done &mdash;
           <b class="${s.left===1?"up":""}">${s.left} race${s.left===1?"":"s"} left this season</b>.</p>
        <p class="small ${o.cls}">${o.text}</p>
        <button class="primary" data-act="continue">
          ${s.left===1?"On to the final race":"On to race "+(s.raced+1)} &raquo;</button>`;
    })()}
  </div>`;
}

function screenSeasonEnd(){
  const se=state.seasonEnd;
  const rows = se.table.map(r=>`
    <tr class="${r.isPlayer?"me":""}">
      <td class="num">${r.place}</td>
      <td><span class="swatch" style="background:${r.colour}"></span> ${esc(r.name)}</td>
      <td class="num">${r.wins}</td>
      <td class="num"><b>${r.pts}</b></td>
    </tr>`).join("");
  let banner;
  if(se.promoted) banner=`<div class="banner good">Champions! ${esc(TIERS[se.tier].name)} won &mdash; promoted to the ${esc(TIERS[se.newTier].name)}.</div>`;
  else if(se.champion) banner=`<div class="banner good">Champions of the ${esc(TIERS[se.tier].name)} &mdash; the top of the sport. Nowhere left to climb.</div>`;
  else if(se.relegated) banner=`<div class="banner bad">Bottom of the ${esc(TIERS[se.tier].name)} &mdash; relegated to the ${esc(TIERS[se.newTier].name)}.</div>`;
  else banner=`<div class="banner">${ordinal(se.pos)} in the ${esc(TIERS[se.tier].name)}. Another season at this level.</div>`;

  return `
  ${banner}
  <div class="panel">
    <h2>Season ${se.season} final table</h2>
    <table><tr><th>Pos</th><th>Club</th><th>Wins</th><th>Pts</th></tr>${rows}</table>
    <p style="margin-top:8px">End of season prize money: <b class="up">${money(se.prize)}</b></p>
  </div>
  <div class="panel center">
    <button class="primary" data-act="nextseason">Start Season ${se.season+1} &raquo;</button>
  </div>`;
}

/* ---- master render -------------------------------------------- */
function render(){
  renderTop(); renderNav(); renderSeasonBar();
  const el=document.getElementById("screen");
  let html="";
  switch(state.screen){
    case "squad":    html=screenSquad(); break;
    case "training": html=screenTraining(); break;
    case "trainsession": html=screenTrainSession(); break;
    case "ground":   html=screenGround(); break;
    case "shop":     html=screenShop(); break;
    case "league":   html=screenLeague(); break;
    case "season":   html=screenSeasonEnd(); break;
    case "race":
      if(state.raceState==="running") html=screenRaceRunning();
      else if(state.raceState==="done") html=screenResults();
      else html=screenRacePreview();
      break;
    default: html=screenSquad();
  }
  el.innerHTML=html;

  // canvases have to be wired up after the HTML lands
  if(state.screen==="race" && state.raceState===null){
    const cv=document.getElementById("preview");
    if(cv) drawCoursePreview(cv, currentCourse());
  }
  if(state.screen==="ground"){
    const cv=document.getElementById("groundcanvas");
    if(cv) drawCoursePreview(cv, homeCourse());
  }
  if(state.screen==="trainsession" && liveTraining && liveTraining.phase==="running"){
    const cv=document.getElementById("traincanvas");
    if(cv){
      TrainView.attach(cv);
      TrainView.setSession(liveTraining.course, liveTraining.result.rows,
                           liveTraining.stat, state.club.colour);
      TrainView.start(()=>finishTrainingSession());
    }
  }
  if(state.screen==="race" && state.raceState==="running"){
    const cv=document.getElementById("racecanvas");
    if(cv && liveRace){
      RaceView.attach(cv);
      RaceView.setRace(liveRace);
      RaceView.speed=34;
      RaceView.start(()=>finishRace());
    }
  }
}

/* ---- events ---------------------------------------------------- */
document.addEventListener("click", e=>{
  const btn = e.target.closest("[data-act]");
  if(!btn) return;
  const act=btn.dataset.act, arg=btn.dataset.arg;
  switch(act){
    case "nav":
      if(state.raceState==="running") return;
      TrainView.stop(); liveTraining=null;
      state.screen=arg; save(); render(); break;
    case "up":        moveInOrder(+arg,-1); break;
    case "down":      moveInOrder(+arg, 1); break;
    case "auto":         autoOrder(); break;
    case "autotactics":  autoTactics(); break;
    case "train":     startTrainingSession(arg); break;
    case "skiptrain": TrainView.skip(); break;
    case "skipintro": TrainView.skipIntro(); break;
    case "buyplot":   buyPlot(arg); break;
    case "buyshoe":   buyShoe(arg); break;
    case "buybuilding": buyBuilding(arg); break;
    case "startrace": startRace(); break;
    case "speed":
      RaceView.speed=+arg;
      document.querySelectorAll('[data-act="speed"]').forEach(b=>b.classList.toggle("on", b.dataset.arg===arg));
      break;
    case "skip":      RaceView.skip(); break;
    case "continue":  continueAfterRace(); break;
    case "nextseason":startNextSeason(); break;
    case "wipe":      wipeSave(); break;
  }
});
document.addEventListener("change", e=>{
  const shoe=e.target.closest("[data-act='shoe']");
  if(shoe){ assignShoe(+shoe.dataset.arg, shoe.value); return; }
  const tac=e.target.closest("[data-act='tactic']");
  if(tac){ setTactic(+tac.dataset.arg, tac.value); return; }
  const all=e.target.closest("[data-act='tacticall']");
  if(all && all.value){ setAllTactics(all.value); return; }
});

   ================================================================ */
function boot(){
  if(!load()){
    let name=null;
    try{ name = prompt("Name your cross country club:", "Hillside Harriers"); }catch(e){}
    newGame((name||"Hillside Harriers").slice(0,26));
  }
  render();
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot);
else boot();
